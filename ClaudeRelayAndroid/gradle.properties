org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# Decouple Android Lint from AGP 8.7's bundled version. AGP 8.7 ships a Lint
# (31.7.x) whose Kotlin Analysis API predates Kotlin 2.3; running it over
# 2.3.21-compiled sources crashes NonNullableMutableLiveDataDetector with
# `IncompatibleClassChangeError: ... KaCallableMemberCall ... interface was
# expected`. Pinning a newer standalone Lint (Kotlin 2.3-aware) fixes the
# lintVitalRelease crash without bumping AGP off the Kotlin 2.3.21-supported
# range. The value is the AGP-style version; AGP maps it to the matching
# lint-gradle artifact (8.13.2 -> com.android.tools.lint:lint-gradle:31.13.2).
android.experimental.lint.version=8.13.2
