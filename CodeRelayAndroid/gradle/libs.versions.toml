[versions]
# AGP 8.13.2: required floor for ConnectBot termlib, whose transitive
# androidx.core(-ktx) 1.18.0 embeds a "requires AGP 8.9.1+ / compileSdk 36"
# constraint that AGP enforces at configuration time. 8.13.2 clears that floor
# with margin AND bundles a Kotlin-2.3-aware R8 + Lint, so the former standalone
# `com.android.tools:r8` buildscript pin and the `android.experimental.lint.version`
# override (both AGP-8.7.3 era workarounds for Kotlin 2.3.21) are now REMOVED.
# Pairs with Gradle wrapper 8.14.3 (AGP 8.13 requires Gradle >= 8.13) and
# compileSdk 36 (platform android-36 + build-tools 36.0.0). targetSdk stays 34,
# minSdk 28 — no runtime behavior change.
agp = "8.13.2"
kotlin = "2.3.21"
coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "4.12.0"
compose-bom = "2026.05.01"
hilt = "2.52"
datastore = "1.1.1"
security-crypto = "1.1.0-alpha06"
junit5 = "5.11.3"
turbine = "1.2.0"
mockk = "1.13.13"

# ONNX Runtime Mobile — the AAR backing the GATED M3-E Silero VAD + Smart-Turn
# detectors. Plain Maven AAR (no CMake/NDK native build). The detectors compile
# against this API now; they only run once ml/validate_parity.py converts the
# CoreML source models to ONNX and M4's parity gate passes. 1.20.0 is the chosen
# stable release (1.22.0 is latest; 1.20.0 has a mature mobile API and resolves
# cleanly on Maven Central).
onnxruntime = "1.20.0"

# ConnectBot termlib — a real VT100/xterm terminal emulator (libvterm via JNI) +
# a Jetpack Compose renderer. Replaces the M2 text-fallback engine that rendered
# raw ANSI control codes as glyphs. 0.1.0 is the latest Maven Central release and
# its published floor is Kotlin stdlib 2.3.21 + Compose BOM 2026.05.01 — both
# matched EXACTLY by our stack, so it resolves cleanly. Ships libjni_cb_term.so
# for arm64-v8a / armeabi-v7a / x86 / x86_64; Apache-2.0.
termlib = "0.1.0"

# Firebase Cloud Messaging (F1 Android push). google-services applies the
# google-services.json config; firebase-bom pins the messaging artifact version.
google-services = "4.4.2"
firebase-bom = "33.7.0"

androidx-test-ext-junit = "1.2.1"
androidx-test-runner = "1.6.2"
androidx-activity-compose = "1.9.3"
androidx-lifecycle = "2.8.7"

# Navigation-Compose for the real M2 nav graph (Splash → Servers → Workspace +
# Settings). 2.8.4 is compatible with compileSdk 34 and the Compose BOM 2024.10.
androidx-navigation-compose = "2.8.4"

# QR share (pure-JVM encode → BitMatrix; we draw the Bitmap ourselves) + scan
# (CameraX preview/analysis → ML Kit barcode detect). Scan is DEVICE-DEFERRED.
zxing = "3.5.3"
camerax = "1.3.4"
mlkit-barcode = "17.3.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
security-crypto = { module = "androidx.security:security-crypto", version.ref = "security-crypto" }
junit5-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5" }
junit5-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit5" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# ONNX Runtime Mobile (Android AAR) — backs the gated Silero VAD + Smart-Turn
# ONNX detectors (M3-E). See the [versions] note for the gating rationale.
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }

# ConnectBot termlib — real VT100/xterm emulator + Compose renderer (see [versions]).
termlib = { module = "org.connectbot:termlib", version.ref = "termlib" }

androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }

# Compose — artifact versions are resolved transitively via the BOM platform.
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

# Material icons (pencil/trash for swipe actions, server.rack empty-state). Version via BOM.
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# Compose Activity host — versioned independently of the Compose BOM.
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }

# Lifecycle Compose integration — viewModel() + collectAsStateWithLifecycle().
# Versioned independently of the Compose BOM; 2.8.x is compatible with compileSdk 34.
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

# Navigation-Compose — the NavHost driving the real M2 nav graph.
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation-compose" }

# QR encode (pure-JVM → BitMatrix; CIQRCodeGenerator analog).
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

# CameraX — preview + image-analysis for the QR scanner (AVCaptureSession analog).
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }

# ML Kit on-device barcode/QR detection (AVCaptureMetadataOutput analog).
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkit-barcode" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
