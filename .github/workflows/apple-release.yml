# TestFlight releases of the iOS and macOS apps, built on GitHub Actions only.
# Started by `/coderelay-deploy ios|mac` (gh workflow run apple-release.yml -f platform=…).
# Spec: docs/superpowers/specs/2026-11-01-remote-release-pipeline-design.md (Part A).
name: Apple release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to ship
        type: choice
        options: [ios, macos, both]
        default: ios
      dry_run:
        description: Archive and check the build number only — no upload, tag or What to Test
        type: boolean
        default: false

permissions:
  contents: write   # push the ios-build-N / mac-build-N tag
  actions: read     # the gate reads ci.yml runs

jobs:
  gate:
    # The dispatched commit must be on main and covered by a green CI run
    # (spec Part A §2; Scripts/ci/ci_gate.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Unit-test the release scripts
        run: python3 -m unittest discover -s Scripts/ci/tests -v
      - name: CI coverage gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/ci/ci_gate.py "$GITHUB_SHA"

  # Separate jobs so one platform failing never stops the other, and one
  # concurrency group each so two runs can never read the same "highest build".
  ios:
    needs: gate
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    concurrency:
      group: apple-release-ios
      cancel-in-progress: false
    uses: ./.github/workflows/apple-build.yml
    with:
      platform: ios
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  macos:
    needs: gate
    if: ${{ inputs.platform == 'macos' || inputs.platform == 'both' }}
    concurrency:
      group: apple-release-macos
      cancel-in-progress: false
    uses: ./.github/workflows/apple-build.yml
    with:
      platform: macos
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  # ── Notarized DMG of the Mac build just uploaded ───────────────────────
  # The same commit and build number as the TestFlight upload above, signed
  # with Developer ID, notarized and stapled (Scripts/ci/mac-dmg.sh), and
  # published as a release of miguelriotinto/coderelay-app — the public
  # download page, kept apart from the source repo's server/Android releases.
  # A failure here never touches the TestFlight build; re-run this job.
  macos-dmg:
    needs: macos
    if: ${{ !cancelled() && needs.macos.result == 'success' && !inputs.dry_run }}
    runs-on: xcode-27
    env:
      BUILD: ${{ needs.macos.outputs.build }}
      APP_REPO: miguelriotinto/coderelay-app
      ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Select newest release Xcode 27
        run: |
          # Same rule as apple-build.yml: what CI compiles is what ships.
          XCODE=$(for app in /Applications/Xcode_27.*.app; do
                    real=$(basename "$(realpath "$app")")
                    case "$real" in (*Release_Candidate*|*[Bb]eta*) continue ;; esac
                    echo "/Applications/$real"
                  done | sort -uV | tail -1)
          if [ -z "$XCODE" ]; then echo "No release Xcode 27 on this runner:"; ls -d /Applications/Xcode*.app; exit 1; fi
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Download the Metal toolchain
        # Xcode 27 no longer bundles it; SwiftTerm's shader needs it.
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen

      - name: Check the secrets
        # Missing secrets FAIL the job rather than skip it: a silently skipped
        # deliverable is how this project's tap bumps once went unnoticed.
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          CERT_P12_B64: ${{ secrets.APPLE_DEVID_CERT_P12_B64 }}
          APP_TOKEN: ${{ secrets.CODERELAY_APP_TOKEN }}
        run: |
          missing=()
          [ -n "$ASC_API_KEY_P8" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] || missing+=(ASC_API_KEY_*)
          [ -n "$CERT_P12_B64" ] || missing+=(APPLE_DEVID_CERT_P12_B64)
          [ -n "$APP_TOKEN" ] || missing+=(CODERELAY_APP_TOKEN)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::not set: ${missing[*]} — no DMG for build $BUILD (docs/RELEASING.md, Secrets)."
            exit 1
          fi

      - name: Write the App Store Connect key
        # notarytool authenticates with it.
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Import the Developer ID certificate
        env:
          CERT_P12_B64: ${{ secrets.APPLE_DEVID_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVID_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/devid.keychain-db"
          KC_PW=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          umask 077
          printf '%s' "$CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/devid.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          read -r -a EXISTING <<< "$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$KC" "${EXISTING[@]}"
          security find-identity -v -p codesigning "$KC" | grep -q '"Developer ID Application' \
            || { echo "APPLE_DEVID_CERT_P12_B64 holds no Developer ID Application identity"; exit 1; }

      - name: Build, sign, notarize
        run: |
          VERSION=$(awk '/^  CodeRelayMac:/{f=1} f&&/MARKETING_VERSION:/{gsub(/[^0-9.]/,"");print;exit}' project.yml)
          [ -n "$VERSION" ] || { echo "no MARKETING_VERSION for CodeRelayMac in project.yml"; exit 1; }
          echo "Mac app $VERSION ($BUILD)"
          Scripts/ci/mac-dmg.sh "$BUILD" "$RUNNER_TEMP/CodeRelay.dmg"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish to coderelay-app
        # The asset is always named CodeRelay.dmg, so
        # releases/latest/download/CodeRelay.dmg is a stable download link.
        env:
          GH_TOKEN: ${{ secrets.CODERELAY_APP_TOKEN }}
        run: |
          TAG="v$VERSION-$BUILD"
          SHA=$(shasum -a 256 "$RUNNER_TEMP/CodeRelay.dmg" | awk '{print $1}')
          URL="https://github.com/$APP_REPO/releases/download/$TAG/CodeRelay.dmg"
          {
            echo "**Code[Relay] for Mac $VERSION (build $BUILD)** — the same app as TestFlight build $BUILD."
            echo
            echo "**[Download CodeRelay.dmg]($URL)** · signed with Developer ID, notarized and stapled by Apple · macOS 14+ · Apple silicon and Intel"
            echo
            echo "Open the DMG and drag Code[Relay] to Applications. You also need the CodeRelay server on the computer you connect to: \`brew install miguelriotinto/coderelay/coderelay\`, then \`claude-relay setup\`."
            echo
            echo "SHA-256 \`$SHA\`"
            echo
            echo "Built from [\`${GITHUB_SHA:0:8}\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) of [$GITHUB_REPOSITORY](https://github.com/$GITHUB_REPOSITORY)."
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" --repo "$APP_REPO" >/dev/null 2>&1; then
            # Re-run of this job for the same build: replace the asset.
            gh release upload "$TAG" "$RUNNER_TEMP/CodeRelay.dmg" --clobber --repo "$APP_REPO"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --repo "$APP_REPO"
          else
            gh release create "$TAG" "$RUNNER_TEMP/CodeRelay.dmg" --repo "$APP_REPO" --target main \
              --title "Code[Relay] for Mac $VERSION ($BUILD)" --notes-file "$RUNNER_TEMP/notes.md" --latest
          fi
          echo "published $TAG (sha256 $SHA)"
