name: Release

# Triggered two ways:
#   1. git push --tags (tag matching v*) — the normal release path
#   2. "Run workflow" button in the Actions UI — for re-runs or out-of-band
#      releases; you type the version ("v0.3.4") manually
#
# Both paths produce identical artifacts: the Linux client tarball, the Linux
# server + CLI tarball, the Android APK, a GitHub Release whose body has one
# section per platform, an arm64 Homebrew bottle of the macOS server uploaded
# to that release, an auto-pushed bump to the homebrew-coderelay tap (with
# the bottle) so `brew upgrade` picks the version up immediately, and the two
# Arch Linux packages (coderelay-bin, coderelay-server-bin) attached to the
# release for `sudo pacman -U <url>`. The iOS and macOS apps ship separately
# (apple-release.yml).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v0.3.4). Must match an existing git tag.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ── Determine which version string to use ───────────────────────────────
  # Downstream jobs read ${{ needs.resolve-version.outputs.tag }} so they
  # don't need to care whether we were triggered by a tag or a button.

  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
    steps:
      - name: Resolve tag name
        id: set
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="$REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Tag '$TAG' does not look like semver (expected vX.Y.Z)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing: $TAG"

  # ── Build the Linux desktop client ──────────────────────────────────────
  # Produces a self-contained image: the app, its jars, the libvterm JNI
  # library built from termlib's pinned source, and a trimmed JRE. The AUR
  # `coderelay-bin` package consumes exactly this tarball, which is also what a
  # user downloads for a manual install (the same route the Android APK takes).

  build-linux:
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # cmake + a C++17 compiler build libjni_cb_term.so from termlib's
      # upstream CMake. These are BUILD-time only; the shipped package depends
      # on libsecret and libnotify at runtime, nothing else.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      # Gate the release on the tests, so a broken build cannot be published.
      # The tag is the version everywhere: the jpackage metadata, the About
      # screen, the tarball name and the AUR pkgver all derive from it.
      - name: Test
        working-directory: CodeRelayLinux
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
        run: ./gradlew build -x :app:createDistributable -PappVersion="${TAG_NAME#v}" --no-daemon

      - name: Build the distributable image
        working-directory: CodeRelayLinux
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
        run: ./gradlew :app:createDistributable -PappVersion="${TAG_NAME#v}" --no-daemon

      - name: Package
        working-directory: CodeRelayLinux
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
        run: |
          IMAGE=app/build/compose/binaries/main/app/coderelay
          test -d "$IMAGE" || { echo "distributable image missing at $IMAGE"; exit 1; }

          # The native library is staged into the image's resources directory
          # (app/build.gradle.kts `stageNativeTerminal`), which the launcher puts
          # on java.library.path; assert it is there rather than discovering at
          # runtime that the terminal cannot start.
          if ! find "$IMAGE" -name 'libjni_cb_term.so' | grep -q .; then
            echo "libjni_cb_term.so is not packaged — the terminal would fail to load"
            exit 1
          fi
          # jpackage embeds packaging/coderelay.png as lib/coderelay.png; the
          # PKGBUILD installs it into hicolor, so its absence is a release bug.
          test -f "$IMAGE/lib/coderelay.png" || { echo "app icon missing from image"; exit 1; }

          # Ship the desktop entry and the scalable icon alongside the image so
          # the AUR package (and a manual installer) has one canonical copy.
          install -Dm644 packaging/coderelay.desktop "$IMAGE/../coderelay.desktop"
          install -Dm644 packaging/coderelay.svg "$IMAGE/../coderelay.svg"

          mkdir -p dist
          tar czf "dist/coderelay-${TAG_NAME}-linux-x86_64.tar.gz" \
            -C app/build/compose/binaries/main/app coderelay coderelay.desktop coderelay.svg

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: coderelay-linux-x86_64
          path: CodeRelayLinux/dist/*.tar.gz

  # ── Build the Linux server + CLI ─────────────────────────────────────────
  # The macOS server (CodeRelayServer/CLI) ported to Linux — see
  # docs/linux-server-spec.md. Statically linked against the Swift runtime, so
  # the tarball drops onto any glibc host and the coderelay-server-bin PKGBUILD
  # consumes exactly it. Gated on the full Swift test suite.

  build-linux-server:
    needs: resolve-version
    # Pinned to 24.04, not ubuntu-latest (26.04): the release tarball's glibc
    # floor is the build host's, so this keeps it running on 24.04 hosts.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      # Pinned so the Linux resolve is reproducible; see ci.yml. The diff step
      # below enforces the invariant: no job may rewrite the committed
      # Package.resolved.
      # swiftly is swift.org's installer and checks the toolchain signature;
      # swift-actions/setup-swift has no Node 24 release.
      - name: Install Swift
        run: |
          # swiftly exits 1 when the toolchain's system dependencies are missing.
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
          tar zxf "swiftly-$(uname -m).tar.gz"
          ./swiftly init --assume-yes --quiet-shell-followup --skip-install
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install --assume-yes --use 6.4
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"

      # Gate the release on the tests, so a broken server cannot be published.
      - name: Test
        run: swift test

      # FoundationNetworking's static archive (lib_CFURLSessionInterface.a)
      # calls libcurl but --static-swift-stdlib does not add -lcurl for it, so
      # the link fails with ~40 `undefined reference to curl_*`. Link libcurl
      # explicitly; it stays a dynamic dependency on the system libcurl.so.4,
      # which the PKGBUILD already depends on (curl is in Arch base). The
      # -dev package provides the libcurl.so link-time symlink on the runner.
      - name: Install libcurl headers (link-time only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Build release binaries (static Swift runtime)
        run: |
          swift build -c release --static-swift-stdlib --product claude-relay-server -Xlinker -lcurl
          swift build -c release --static-swift-stdlib --product claude-relay -Xlinker -lcurl

      - name: Assemble the tarball
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
        run: |
          STAGE=dist/stage
          mkdir -p "$STAGE"
          install -m755 .build/release/claude-relay-server "$STAGE/"
          install -m755 .build/release/claude-relay "$STAGE/"

          # Agent-detection manifests, resolved by Bundle.module next to the
          # binary. Absent → the server fatal-errors on the first session create.
          # `.build/release` is a symlink and find(1) does not descend into a
          # symlinked start point without the trailing slash — without it this
          # matched nothing and the step failed with "bundle missing".
          BUNDLE=$(find .build/release/ -maxdepth 1 \( -name 'CodeRelay_CodeRelayServer.resources' -o -name 'CodeRelay_CodeRelayServer.bundle' \) | head -1)
          test -n "$BUNDLE" || { echo "server resource bundle missing"; ls -la .build/release/; exit 1; }
          cp -a "$BUNDLE" "$STAGE/"

          install -m755 Scripts/hooks/claude-relay-state-hook.sh "$STAGE/"
          install -m644 packaging/claude-relay.service "$STAGE/"
          install -m644 LICENSE "$STAGE/"

          # Fail loudly if the server picked up a dynamic Swift/Foundation dep —
          # the whole point of the static build is that it has none.
          if ldd "$STAGE/claude-relay-server" | grep -iqE 'libswift|libFoundation'; then
            echo "server links the Swift runtime dynamically — static build regressed"
            ldd "$STAGE/claude-relay-server"; exit 1
          fi

          mkdir -p dist/out
          tar czf "dist/out/claude-relay-${TAG_NAME}-linux-x86_64.tar.gz" -C "$STAGE" .

      - name: Package.resolved is unchanged after the Linux resolve
        run: git diff --exit-code -- Package.resolved

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: claude-relay-linux-x86_64
          path: dist/out/*.tar.gz

  # ── Build the Android client ─────────────────────────────────────────────
  # The APK is a first-class release asset next to the two Linux tarballs: the
  # user installs it by downloading it from the release page on the phone (no
  # adb), so it must be here, sectioned and checksummed like everything else.
  #
  # Signing: the release buildType reads `keystore.properties`. When the four
  # ANDROID_* secrets are set the job writes that file from them and the APK is
  # signed with the real key; otherwise Gradle's fallback debug-signs it with
  # the runner's throwaway key. Android refuses an update whose signer differs
  # from the installed app, so an unsigned CI build cannot be installed over a
  # phone that has a properly signed one — the release body says which it is.
  #   ANDROID_KEYSTORE_B64      base64 of the .jks/.keystore file
  #   ANDROID_KEYSTORE_PASSWORD store password
  #   ANDROID_KEY_ALIAS         key alias
  #   ANDROID_KEY_PASSWORD      key password
  # The Android versionName is its own milestone scheme (0.3-mNN, see
  # RELEASE.md), independent of the release tag; both appear in the body.

  build-android:
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      signing: ${{ steps.sign.outputs.signing }}
    defaults:
      run:
        working-directory: CodeRelayAndroid
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default is `tools platform-tools`, and `tools` no longer
          # exists in Google's repo — the step fails with "Failed to find package
          # 'tools'" before Gradle ever runs.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Read versionName / versionCode
        id: version
        run: |
          VN=$(grep -E '^\s*versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VC=$(grep -E '^\s*versionCode = ' app/build.gradle.kts | sed -E 's/.*= *([0-9]+).*/\1/')
          test -n "$VN" && test -n "$VC" || { echo "could not read versionName/versionCode from app/build.gradle.kts"; exit 1; }
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "Android $VN (versionCode $VC)"

      - name: Configure release signing from secrets (if present)
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE_B64 is not set; the APK will be debug-signed with the runner's key."
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for v in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "ANDROID_KEYSTORE_B64 is set but ANDROID_$v is missing"; exit 1; }
          done
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          # keystore.properties is gitignored; build.gradle.kts reads exactly these keys.
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 keystore.properties
          echo "signing=release" >> "$GITHUB_OUTPUT"

      # Gate the release on the unit tests, as the Linux jobs do.
      - name: Test
        run: ./gradlew test testDebugUnitTest --no-daemon

      - name: Assemble the release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Package
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
          SIGNING: ${{ steps.sign.outputs.signing }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "release APK missing at $APK"; ls -R app/build/outputs/apk || true; exit 1; }

          # Prove the signer matches what the job believes it configured, and
          # print it so the run log shows which certificate a phone will see.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            # AGP normally pulls build-tools in during the build; make sure.
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "build-tools;34.0.0"
            APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          fi
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          if [ "$SIGNING" = "release" ] && grep -q 'CN=Android Debug' /tmp/certs.txt; then
            echo "expected the release key but the APK is debug-signed — keystore.properties was not picked up"
            exit 1
          fi

          mkdir -p dist
          cp "$APK" "dist/coderelay-${TAG_NAME}-android.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: coderelay-android
          path: CodeRelayAndroid/dist/*.apk

  # ── Create GitHub Release + publish artifacts ───────────────────────────

  release:
    needs: [resolve-version, build-linux, build-linux-server, build-android]
    # The Linux client, Linux server and Android APK are the artifacts this
    # release exists to publish, so all three gate it. The macOS bottle is
    # built after it (job `bottle`) and uploaded to this release.
    if: ${{ !cancelled() && needs.resolve-version.result == 'success' && needs.build-linux.result == 'success' && needs.build-linux-server.result == 'success' && needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      source_sha256: ${{ steps.sha.outputs.source_sha256 }}
      linux_sha256: ${{ steps.sha.outputs.linux_sha256 }}
      server_sha256: ${{ steps.sha.outputs.server_sha256 }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute binary checksums
        run: |
          cd artifacts
          sha256sum -- *.tar.gz *.apk | tee checksums.txt

      - name: Compute source tarball SHA256
        id: sha
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          SOURCE_SHA=$(curl -sL "https://github.com/${REPO}/archive/refs/tags/${TAG_NAME}.tar.gz" | sha256sum | awk '{print $1}')
          echo "Source tarball SHA256: $SOURCE_SHA"
          echo "source_sha256=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

          # The Linux tarballs' checksums go into the Arch PKGBUILDs. Taken from
          # the artifact we just built rather than re-downloading the published
          # asset, so the value cannot drift from what is actually shipped.
          LINUX_TARBALL="artifacts/coderelay-${TAG_NAME}-linux-x86_64.tar.gz"
          if [ -f "$LINUX_TARBALL" ]; then
            LINUX_SHA=$(sha256sum "$LINUX_TARBALL" | awk '{print $1}')
            echo "Linux tarball SHA256: $LINUX_SHA"
            echo "linux_sha256=$LINUX_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "Linux tarball not found; the arch-packages job will fail for coderelay-bin."
          fi
          SERVER_TARBALL="artifacts/claude-relay-${TAG_NAME}-linux-x86_64.tar.gz"
          if [ -f "$SERVER_TARBALL" ]; then
            SERVER_SHA=$(sha256sum "$SERVER_TARBALL" | awk '{print $1}')
            echo "Linux server tarball SHA256: $SERVER_SHA"
            echo "server_sha256=$SERVER_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "Linux server tarball not found; the arch-packages job will fail for coderelay-server-bin."
          fi

      # The release body is one section per platform — what the asset is, how
      # to install it, and its checksum — so a visitor to the Releases page can
      # find their download without reading the changelog. The auto-generated
      # "What's Changed" list is appended below it by action-gh-release.
      - name: Write release notes
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
          REPO: ${{ github.repository }}
          ANDROID_VERSION_NAME: ${{ needs.build-android.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ needs.build-android.outputs.version_code }}
          ANDROID_SIGNING: ${{ needs.build-android.outputs.signing }}
        run: |
          DL="https://github.com/${REPO}/releases/download/${TAG_NAME}"
          CLIENT="coderelay-${TAG_NAME}-linux-x86_64.tar.gz"
          SERVER="claude-relay-${TAG_NAME}-linux-x86_64.tar.gz"
          APK="coderelay-${TAG_NAME}-android.apk"
          # Arch packages, attached by the arch-packages job after this release
          # exists. pkgrel is always 1 (that job stamps it); makepkg names the
          # file <pkgname>-<pkgver>-<pkgrel>-<arch>.pkg.tar.zst.
          CLIENT_PKG="coderelay-bin-${TAG_NAME#v}-1-x86_64.pkg.tar.zst"
          SERVER_PKG="coderelay-server-bin-${TAG_NAME#v}-1-x86_64.pkg.tar.zst"
          sha() { awk -v f="$1" '$2 == f { print $1 }' artifacts/checksums.txt; }

          {
            echo "## Downloads"
            echo
            echo "| Platform | Asset | Version |"
            echo "|---|---|---|"
            echo "| Linux client (x86_64) | Arch: [\`${CLIENT_PKG}\`](${DL}/${CLIENT_PKG}) · any distro: [\`${CLIENT}\`](${DL}/${CLIENT}) | ${TAG_NAME} |"
            echo "| Linux server + CLI (x86_64) | Arch: [\`${SERVER_PKG}\`](${DL}/${SERVER_PKG}) · any distro: [\`${SERVER}\`](${DL}/${SERVER}) | ${TAG_NAME} |"
            echo "| Android client | [\`${APK}\`](${DL}/${APK}) | ${ANDROID_VERSION_NAME} (versionCode ${ANDROID_VERSION_CODE}) |"
            echo "| macOS server + CLI (Apple silicon) | Homebrew: \`brew install miguelriotinto/coderelay/coderelay\` | ${TAG_NAME} |"
            echo "| iOS / macOS app | TestFlight | — |"
            echo
            echo "### Linux client"
            echo
            echo "Compose Desktop app for Arch / Omarchy and any x86_64 glibc host, with its own JRE and the libvterm terminal bundled. Runtime deps: \`libsecret\`, \`libnotify\`."
            echo
            echo '```bash'
            echo "sudo pacman -U ${DL}/${CLIENT_PKG}   # Arch / Omarchy"
            echo "# or on any x86_64 glibc host:"
            echo "curl -LO ${DL}/${CLIENT}"
            echo "tar xzf ${CLIENT} && ./coderelay/bin/coderelay"
            echo '```'
            echo
            echo "### Linux server + CLI"
            echo
            echo "\`claude-relay-server\` and the \`claude-relay\` CLI, statically linked against the Swift runtime, plus the systemd user unit and the agent state hook. Runs as \`claude-relay.service\` for your user."
            echo
            echo '```bash'
            echo "sudo pacman -U ${DL}/${SERVER_PKG}   # Arch / Omarchy"
            echo "claude-relay setup                         # starts the service, prints a pairing QR"
            echo "# or on any x86_64 glibc host:"
            echo "curl -LO ${DL}/${SERVER}"
            echo "mkdir -p claude-relay && tar xzf ${SERVER} -C claude-relay"
            echo '```'
            echo
            echo "### Android client"
            echo
            echo "Version ${ANDROID_VERSION_NAME} (versionCode ${ANDROID_VERSION_CODE}). Open this page on the phone, download the APK, and install it over the existing app; allow installs from your browser if Android asks."
            if [ "$ANDROID_SIGNING" != "release" ]; then
              echo
              echo "> **Signing:** this APK is debug-signed with a CI key. Android will not install it over a build signed with a different key — uninstall the old app first, or configure the \`ANDROID_KEYSTORE_*\` repository secrets so the release workflow signs with the project key."
            fi
            echo
            echo "### macOS"
            echo
            echo "The server ships through Homebrew as a prebuilt Apple-silicon bottle (the tap is bumped by this release); the desktop and iOS apps go through TestFlight."
            echo
            echo "### Checksums (SHA-256)"
            echo
            echo '```'
            cat artifacts/checksums.txt
            echo '```'
            echo
          } > release-notes.md

          echo "=== release-notes.md ==="
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.apk
            artifacts/checksums.txt

  # ── Homebrew bottle of the macOS server (arm64) ─────────────────────────
  # Runs after the release exists so a bottle failure never holds back the
  # Linux/Android assets; the tap is only bumped once a bottle is uploaded.
  # Recover a failure by re-running this job, then `homebrew`.

  bottle:
    needs: [resolve-version, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: xcode-27
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Select newest release Xcode 27
        run: |
          # Release builds only, symlinks resolved (Xcode_27.2.app is the RC); same
          # rule as apple-build.yml so CI compiles with what ships.
          XCODE=$(for app in /Applications/Xcode_27.*.app; do
                    real=$(basename "$(realpath "$app")")
                    case "$real" in (*Release_Candidate*|*[Bb]eta*) continue ;; esac
                    echo "/Applications/$real"
                  done | sort -uV | tail -1)
          if [ -z "$XCODE" ]; then echo "No release Xcode 27 on this runner:"; ls -d /Applications/Xcode*.app; exit 1; fi
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Download the Metal toolchain
        # Xcode 27 no longer bundles it; SwiftTerm's shader is part of the
        # package graph brew builds.
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Unit-test the release scripts
        run: python3 -m unittest discover -s Scripts/ci/tests -v

      - name: Build the bottle
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
          SOURCE_SHA: ${{ needs.release.outputs.source_sha256 }}
          REPO: ${{ github.repository }}
        run: |
          brew tap-new --no-git local/ci
          TAP_DIR="$(brew --repository)/Library/Taps/local/homebrew-ci"
          cp Formula/coderelay.rb "$TAP_DIR/Formula/coderelay.rb"
          python3 Scripts/ci/formula.py "$TAP_DIR/Formula/coderelay.rb" \
            --repo "$REPO" --tag "$TAG_NAME" --source-sha "$SOURCE_SHA"
          brew install --build-bottle local/ci/coderelay
          mkdir -p bottle && cd bottle
          brew bottle --json --root-url="https://github.com/${REPO}/releases/download/${TAG_NAME}" local/ci/coderelay

      - name: Upload the bottle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
        run: |
          cd bottle
          shopt -s nullglob
          files=(*.bottle.tar.gz)
          [ "${#files[@]}" -eq 1 ] || { echo "expected one bottle, found ${#files[@]}: ${files[*]}"; exit 1; }
          # `brew bottle` writes name--version.tag.bottle.tar.gz; Homebrew
          # downloads name-version.tag.bottle.tar.gz from root_url.
          LOCAL="${files[0]}"
          ASSET="${LOCAL/--/-}"
          case "$ASSET" in *--*|"$LOCAL") echo "unexpected bottle name $LOCAL"; exit 1 ;; esac
          mv "$LOCAL" "$ASSET"
          echo "bottle: $ASSET"
          gh release upload "$TAG_NAME" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v6
        with:
          name: bottle-json
          path: bottle/*.json

  # ── Push the formula (url, sha256, bottle) to the tap and to main ───────
  # Needs HOMEBREW_TAP_TOKEN: a fine-grained PAT with Contents read/write on
  # miguelriotinto/homebrew-coderelay. The tap copy is rendered from the
  # tagged Formula/coderelay.rb, main's from main's, so both carry the same
  # url/sha256/bottle and a formula change merged after the tag is not reverted.

  homebrew:
    needs: [resolve-version, release, bottle]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.bottle.result == 'success' }}
    env:
      TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
      SOURCE_SHA: ${{ needs.release.outputs.source_sha256 }}
      REPO: ${{ github.repository }}
    steps:
      - name: Check tap token is configured
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # A missing token used to skip silently, which left the Mac on an old
          # server with every run green. Now it fails the run.
          if [ -z "$TOKEN" ]; then echo "HOMEBREW_TAP_TOKEN secret is not set"; exit 1; fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}
          path: tagged

      - uses: actions/checkout@v5
        with:
          ref: main
          path: main

      - name: Checkout tap
        uses: actions/checkout@v5
        with:
          repository: miguelriotinto/homebrew-coderelay
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - uses: actions/download-artifact@v7
        with:
          name: bottle-json
          path: bottle-json

      - name: Render both formula copies
        run: |
          JSON=$(ls bottle-json/*.json)
          cp tagged/Formula/coderelay.rb tap/Formula/coderelay.rb
          # The formula was clauderelay through v0.3.39. formula_renames.json makes
          # `brew upgrade` migrate an existing clauderelay install to coderelay.
          git -C tap rm -q --ignore-unmatch Formula/clauderelay.rb
          echo '{ "clauderelay": "coderelay" }' > tap/formula_renames.json
          for f in tap/Formula/coderelay.rb main/Formula/coderelay.rb; do
            python3 tagged/Scripts/ci/formula.py "$f" \
              --repo "$REPO" --tag "$TAG_NAME" --source-sha "$SOURCE_SHA" --bottle-json "$JSON"
          done
          echo "=== tap diff ==="; git -C tap status --short; git -C tap --no-pager diff
          echo "=== main diff ==="; git -C main --no-pager diff

      - name: Push the tap
        run: |
          cd tap
          git add -A Formula formula_renames.json
          # Staged, not `git diff`: the renamed formula and formula_renames.json
          # are new files, which `git diff` does not see.
          if git diff --cached --quiet; then echo "Tap already at ${TAG_NAME}."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "coderelay ${TAG_NAME}" -m "Automated bump from CodeRelay release workflow."
          git push

      - name: Push Formula/ to main
        run: |
          cd main
          if git diff --quiet Formula/coderelay.rb; then echo "main's formula already at ${TAG_NAME}."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/coderelay.rb
          git commit -m "chore(formula): ${TAG_NAME} bottle"
          # main may have moved since checkout; Formula/ is touched only here.
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }

  # ── Arch Linux packages, attached to the release ────────────────────────
  # Builds coderelay-bin and coderelay-server-bin from the checked-in PKGBUILDs
  # against the tarballs the release job just published (makepkg downloads
  # them and checks the stamped sha256), installs both into a clean Arch
  # container as a user would, and uploads the .pkg.tar.zst files to the
  # release so `sudo pacman -U <url>` installs straight from the Releases page.
  # This replaces the AUR, which needed an account. One job rather than a
  # matrix because both packages append to the same checksums.txt. Like the
  # bottle it runs after the release exists, so a packaging failure never holds
  # back the other assets; recover by re-running this job.
  arch-packages:
    needs: [resolve-version, release]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Stamp pkgver + sha256 into the PKGBUILDs
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
          CLIENT_SHA: ${{ needs.release.outputs.linux_sha256 }}
          SERVER_SHA: ${{ needs.release.outputs.server_sha256 }}
        run: |
          # pkgver has no leading "v"; the release tag does.
          PKGVER="${TAG_NAME#v}"
          mkdir -p pkg/coderelay-bin pkg/coderelay-server-bin
          cp CodeRelayLinux/packaging/PKGBUILD pkg/coderelay-bin/
          cp packaging/PKGBUILD packaging/coderelay-server.install pkg/coderelay-server-bin/
          stamp() {
            [ -n "$2" ] || { echo "No tarball checksum from the release job for $1"; exit 1; }
            sed -i -E "s|^pkgver=.*|pkgver=${PKGVER}|; s|^pkgrel=.*|pkgrel=1|; s|^sha256sums=\(.*\)$|sha256sums=('$2')|" "$1/PKGBUILD"
            grep -q "^sha256sums=('$2')$" "$1/PKGBUILD" || { echo "sha256sums was not rewritten in $1"; exit 1; }
            grep -E '^(pkgname|pkgver|pkgrel|sha256sums)=' "$1/PKGBUILD"
          }
          stamp pkg/coderelay-bin "$CLIENT_SHA"
          stamp pkg/coderelay-server-bin "$SERVER_SHA"

      # makepkg refuses to run as root, hence the build user. --nodeps because
      # these are prebuilt packages: the runtime deps only matter at install,
      # where pacman -U resolves them exactly as it will on a user's machine.
      - name: Build and install-test in Arch
        run: |
          docker run --rm -v "$PWD/pkg:/pkg" archlinux:base-devel bash -euo pipefail -c '
            pacman -Syu --noconfirm >/dev/null
            useradd -m build && chown -R build /pkg
            for p in coderelay-bin coderelay-server-bin; do
              su build -c "cd /pkg/$p && makepkg --nodeps --noconfirm"
            done
            pacman -U --noconfirm /pkg/*/*.pkg.tar.zst
            pacman -Q coderelay-bin coderelay-server-bin
            claude-relay --help >/dev/null
            test -x /usr/bin/claude-relay-server
            [ -d /usr/bin/CodeRelay_CodeRelayServer.bundle ] || [ -d /usr/bin/CodeRelay_CodeRelayServer.resources ]
            test -f /usr/lib/systemd/user/claude-relay.service
            test -x /usr/bin/coderelay
            test -f /usr/share/applications/coderelay.desktop
          '
          ls -l pkg/*/*.pkg.tar.zst

      - name: Upload the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
        run: |
          # pkg/ is owned by the container's build user; work in RUNNER_TEMP.
          OUT="$RUNNER_TEMP/arch"
          mkdir -p "$OUT"
          cp pkg/*/*.pkg.tar.zst "$OUT/"
          cd "$OUT"
          gh release download "$TAG_NAME" -R "$GITHUB_REPOSITORY" -p checksums.txt
          # Idempotent on a re-run: drop any earlier line for these files first.
          for f in *.pkg.tar.zst; do
            grep -v "  ${f}$" checksums.txt > checksums.new || true
            mv checksums.new checksums.txt
            sha256sum -- "$f" >> checksums.txt
          done
          cat checksums.txt
          gh release upload "$TAG_NAME" -R "$GITHUB_REPOSITORY" --clobber -- *.pkg.tar.zst checksums.txt
