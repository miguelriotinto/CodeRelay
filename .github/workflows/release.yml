name: Release

# Triggered two ways:
#   1. git push --tags (tag matching v*) — the normal release path
#   2. "Run workflow" button in the Actions UI — for re-runs or out-of-band
#      releases; you type the version ("v0.3.4") manually
#
# Both paths produce identical artifacts: arm64 + x86_64 tarballs, a GitHub
# Release, and an auto-push of the formula bump to the homebrew-clauderelay
# tap so `brew upgrade clauderelay` picks it up immediately.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v0.3.4). Must match an existing git tag.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ── Determine which version string to use ───────────────────────────────
  # Downstream jobs read ${{ needs.resolve-version.outputs.tag }} so they
  # don't need to care whether we were triggered by a tag or a button.

  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
    steps:
      - name: Resolve tag name
        id: set
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="$REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Tag '$TAG' does not look like semver (expected vX.Y.Z)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing: $TAG"

  # ── Build release binaries ──────────────────────────────────────────────

  build:
    needs: resolve-version
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15
            arch: x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Build release binaries
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # Build ONLY the two server products (matches Formula/clauderelay.rb).
          # A bare `swift build` compiles the whole package — including
          # ClaudeRelaySpeech → WhisperKit, which the server does not use and
          # which fails to compile on the CI runner's toolchain (@retroactive /
          # MLState, and older swift-jinja tools-version conflicts). Scoping to
          # the products SPM only compiles their dependency subgraph.
          if [ "$ARCH" = "x86_64" ]; then
            swift build -c release --disable-sandbox -Xswiftc -cross-module-optimization --triple x86_64-apple-macosx --product claude-relay-server --product claude-relay
          else
            swift build -c release --disable-sandbox -Xswiftc -cross-module-optimization --product claude-relay-server --product claude-relay
          fi

      - name: Package binaries
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          if [ "$ARCH" = "x86_64" ]; then
            cp .build/x86_64-apple-macosx/release/claude-relay dist/
            cp .build/x86_64-apple-macosx/release/claude-relay-server dist/
          else
            cp .build/release/claude-relay dist/
            cp .build/release/claude-relay-server dist/
          fi
          cd dist
          tar czf "claude-relay-${TAG_NAME}-macos-${ARCH}.tar.gz" claude-relay claude-relay-server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-relay-${{ matrix.arch }}
          path: dist/*.tar.gz


  # ── Build the Linux desktop client ──────────────────────────────────────
  # Produces a self-contained image: the app, its jars, the libvterm JNI
  # library built from termlib's pinned source, and a trimmed JRE. The AUR
  # `coderelay-bin` package consumes exactly this tarball, which is also what a
  # user downloads for a manual install (the same route the Android APK takes).

  build-linux:
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # cmake + a C++17 compiler build libjni_cb_term.so from termlib's
      # upstream CMake. These are BUILD-time only; the shipped package depends
      # on libsecret and libnotify at runtime, nothing else.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      # Gate the release on the tests, so a broken build cannot be published.
      - name: Test
        working-directory: ClaudeRelayLinux
        run: ./gradlew build -x :app:createDistributable --no-daemon

      - name: Build the distributable image
        working-directory: ClaudeRelayLinux
        run: ./gradlew :app:createDistributable --no-daemon

      - name: Package
        working-directory: ClaudeRelayLinux
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
        run: |
          IMAGE=app/build/compose/binaries/main/app/coderelay
          test -d "$IMAGE" || { echo "distributable image missing at $IMAGE"; exit 1; }

          # The native library ships inside the module jar as a resource and is
          # extracted at first use; assert it is there rather than discovering
          # at runtime that the terminal cannot start.
          if ! find "$IMAGE" -name '*.jar' -exec unzip -l {} \; 2>/dev/null | grep -q 'libjni_cb_term.so'; then
            echo "libjni_cb_term.so is not packaged — the terminal would fail to load"
            exit 1
          fi

          # Ship the desktop entry alongside the image so the AUR package (and a
          # manual installer) has one canonical copy.
          install -Dm644 packaging/coderelay.desktop "$IMAGE/../coderelay.desktop"

          mkdir -p dist
          tar czf "dist/coderelay-${TAG_NAME}-linux-x86_64.tar.gz" \
            -C app/build/compose/binaries/main/app coderelay coderelay.desktop

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coderelay-linux-x86_64
          path: ClaudeRelayLinux/dist/*.tar.gz

  # ── Create GitHub Release + publish artifacts ───────────────────────────

  release:
    needs: [resolve-version, build, build-linux]
    runs-on: ubuntu-latest
    outputs:
      source_sha256: ${{ steps.sha.outputs.source_sha256 }}
      linux_sha256: ${{ steps.sha.outputs.linux_sha256 }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute binary checksums
        run: |
          cd artifacts
          for f in *.tar.gz; do
            sha256sum "$f"
          done | tee checksums.txt

      - name: Compute source tarball SHA256
        id: sha
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          SOURCE_SHA=$(curl -sL "https://github.com/${REPO}/archive/refs/tags/${TAG_NAME}.tar.gz" | sha256sum | awk '{print $1}')
          echo "Source tarball SHA256: $SOURCE_SHA"
          echo "source_sha256=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

          # The Linux tarball's checksum goes into the AUR PKGBUILD. Taken from
          # the artifact we just built rather than re-downloading the published
          # asset, so the value cannot drift from what is actually shipped.
          LINUX_TARBALL="artifacts/coderelay-${TAG_NAME}-linux-x86_64.tar.gz"
          if [ -f "$LINUX_TARBALL" ]; then
            LINUX_SHA=$(sha256sum "$LINUX_TARBALL" | awk '{print $1}')
            echo "Linux tarball SHA256: $LINUX_SHA"
            echo "linux_sha256=$LINUX_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "Linux tarball not found; the AUR job will skip."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/checksums.txt

  # ── Push formula update to homebrew-clauderelay tap ─────────────────────
  # Needs the HOMEBREW_TAP_TOKEN repo secret: a PAT with `contents: write`
  # on miguelriotinto/homebrew-clauderelay. If the secret is missing or
  # empty, this job is skipped (useful for dry-run tag pushes).

  homebrew:
    needs: [resolve-version, release]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    steps:
      - name: Check tap token is configured
        id: check_token
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN secret is not set; skipping tap update."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tap
        if: steps.check_token.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          repository: miguelriotinto/homebrew-clauderelay
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula url + sha256
        if: steps.check_token.outputs.skip == 'false'
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
          SOURCE_SHA: ${{ needs.release.outputs.source_sha256 }}
          REPO: ${{ github.repository }}
        run: |
          cd tap
          FORMULA=Formula/clauderelay.rb

          # Replace url line (anchored to the archive path so we only touch
          # the release URL, not the head "…" URL).
          sed -i.bak -E \
            "s|^(  url \"https://github.com/${REPO//\//\\/}/archive/refs/tags/)v[0-9]+\.[0-9]+\.[0-9]+(\.tar\.gz\")$|\1${TAG_NAME}\2|" \
            "$FORMULA"

          # Replace sha256 line (the first one, which belongs to `url`; the
          # formula has no bottle block so there's only one).
          sed -i.bak -E \
            "s|^(  sha256 \")[a-f0-9]{64}(\")$|\1${SOURCE_SHA}\2|" \
            "$FORMULA"

          rm -f "$FORMULA.bak"

          echo "=== Diff ==="
          git --no-pager diff "$FORMULA"

          if git diff --quiet "$FORMULA"; then
            echo "Formula unchanged (already at ${TAG_NAME}?). Nothing to commit."
            exit 0
          fi

      - name: Commit + push
        if: steps.check_token.outputs.skip == 'false'
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
        run: |
          cd tap
          if git diff --quiet Formula/clauderelay.rb; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/clauderelay.rb
          git commit -m "clauderelay ${TAG_NAME}" -m "Automated bump from ClaudeRelay release workflow."
          git push

  # ── Push PKGBUILD update to the AUR ─────────────────────────────────────
  # Needs two secrets:
  #   AUR_SSH_KEY   — private key of an SSH keypair registered on the AUR
  #                   account that owns `coderelay-bin`
  #   AUR_USERNAME  — the AUR account name (for the commit author)
  # If either is missing the job skips, so a dry-run tag push is harmless.
  #
  # Mirrors the homebrew job above. The AUR is a plain git remote, so this is
  # a checkout, a sed of pkgver + sha256, and a push — .SRCINFO regenerated
  # from the PKGBUILD, which the AUR requires to match.

  aur:
    needs: [resolve-version, release]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.linux_sha256 != '' }}
    steps:
      - name: Check AUR credentials are configured
        id: check_key
        env:
          KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "AUR_SSH_KEY secret is not set; skipping AUR update."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check_key.outputs.skip == 'false'
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Configure SSH for aur.archlinux.org
        if: steps.check_key.outputs.skip == 'false'
        env:
          KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # Pin the host key rather than disabling verification: this pushes a
          # package thousands of people install, so an unverified host is not
          # an acceptable shortcut.
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF

      - name: Clone the AUR package
        if: steps.check_key.outputs.skip == 'false'
        run: git clone ssh://aur@aur.archlinux.org/coderelay-bin.git aur

      - name: Update pkgver + sha256
        if: steps.check_key.outputs.skip == 'false'
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
          LINUX_SHA: ${{ needs.release.outputs.linux_sha256 }}
        run: |
          # The AUR pkgver has no leading "v"; the release tag does.
          PKGVER="${TAG_NAME#v}"

          cp ClaudeRelayLinux/packaging/PKGBUILD aur/PKGBUILD
          cd aur

          sed -i -E "s|^pkgver=.*|pkgver=${PKGVER}|" PKGBUILD
          sed -i -E "s|^pkgrel=.*|pkgrel=1|" PKGBUILD
          sed -i -E "s|^sha256sums=\(.*\)$|sha256sums=('${LINUX_SHA}')|" PKGBUILD

          echo "=== PKGBUILD diff ==="
          git --no-pager diff PKGBUILD || true

          if git diff --quiet PKGBUILD; then
            echo "PKGBUILD unchanged (already at ${PKGVER}?). Nothing to push."
            exit 0
          fi

      # .SRCINFO is generated metadata the AUR validates against the PKGBUILD;
      # a mismatch is rejected on push. Generated in an Arch container because
      # makepkg is not available on the runner.
      - name: Regenerate .SRCINFO
        if: steps.check_key.outputs.skip == 'false'
        run: |
          docker run --rm -v "$PWD/aur:/pkg" -w /pkg archlinux:base-devel \
            bash -c 'useradd -m build && chown -R build /pkg && su build -c "makepkg --printsrcinfo" > .SRCINFO'
          head -20 aur/.SRCINFO

      - name: Commit + push
        if: steps.check_key.outputs.skip == 'false'
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
        run: |
          cd aur
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "${AUR_USERNAME:-github-actions}"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "coderelay-bin ${TAG_NAME#v}" -m "Automated bump from the CodeRelay release workflow."
          git push
