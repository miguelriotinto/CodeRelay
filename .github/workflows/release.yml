name: Release

# Triggered two ways:
#   1. git push --tags (tag matching v*) — the normal release path
#   2. "Run workflow" button in the Actions UI — for re-runs or out-of-band
#      releases; you type the version ("v0.3.4") manually
#
# Both paths produce identical artifacts: the Linux client tarball, the Linux
# server + CLI tarball, the Android APK (and the macOS server tarballs when
# that best-effort build succeeds), a GitHub Release whose body has one
# section per platform, and auto-pushed bumps to the homebrew-clauderelay tap
# and the AUR so `brew upgrade` / `yay -Syu` pick the version up immediately.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v0.3.4). Must match an existing git tag.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ── Determine which version string to use ───────────────────────────────
  # Downstream jobs read ${{ needs.resolve-version.outputs.tag }} so they
  # don't need to care whether we were triggered by a tag or a button.

  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
    steps:
      - name: Resolve tag name
        id: set
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="$REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Tag '$TAG' does not look like semver (expected vX.Y.Z)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing: $TAG"

  # ── Build release binaries ──────────────────────────────────────────────

  build:
    needs: resolve-version
    # Best-effort. The macOS server binaries are not what ships: the server is
    # installed with `brew` from HEAD on the Mac, and this build has failed on
    # the runner toolchain for the last three tags, which also blocked the
    # release job and, with it, the Linux tarball. A failure here is surfaced
    # as an annotation, not a blocked release.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15
            arch: x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Build release binaries
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # Build ONLY the two server products (matches Formula/clauderelay.rb).
          # A bare `swift build` compiles the whole package — including
          # ClaudeRelaySpeech → WhisperKit, which the server does not use and
          # which fails to compile on the CI runner's toolchain (@retroactive /
          # MLState, and older swift-jinja tools-version conflicts). Scoping to
          # the products SPM only compiles their dependency subgraph.
          if [ "$ARCH" = "x86_64" ]; then
            swift build -c release --disable-sandbox -Xswiftc -cross-module-optimization --triple x86_64-apple-macosx --product claude-relay-server --product claude-relay
          else
            swift build -c release --disable-sandbox -Xswiftc -cross-module-optimization --product claude-relay-server --product claude-relay
          fi

      - name: Package binaries
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          if [ "$ARCH" = "x86_64" ]; then
            cp .build/x86_64-apple-macosx/release/claude-relay dist/
            cp .build/x86_64-apple-macosx/release/claude-relay-server dist/
          else
            cp .build/release/claude-relay dist/
            cp .build/release/claude-relay-server dist/
          fi
          cd dist
          tar czf "claude-relay-${TAG_NAME}-macos-${ARCH}.tar.gz" claude-relay claude-relay-server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-relay-${{ matrix.arch }}
          path: dist/*.tar.gz


  # ── Build the Linux desktop client ──────────────────────────────────────
  # Produces a self-contained image: the app, its jars, the libvterm JNI
  # library built from termlib's pinned source, and a trimmed JRE. The AUR
  # `coderelay-bin` package consumes exactly this tarball, which is also what a
  # user downloads for a manual install (the same route the Android APK takes).

  build-linux:
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # cmake + a C++17 compiler build libjni_cb_term.so from termlib's
      # upstream CMake. These are BUILD-time only; the shipped package depends
      # on libsecret and libnotify at runtime, nothing else.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      # Gate the release on the tests, so a broken build cannot be published.
      # The tag is the version everywhere: the jpackage metadata, the About
      # screen, the tarball name and the AUR pkgver all derive from it.
      - name: Test
        working-directory: ClaudeRelayLinux
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
        run: ./gradlew build -x :app:createDistributable -PappVersion="${TAG_NAME#v}" --no-daemon

      - name: Build the distributable image
        working-directory: ClaudeRelayLinux
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
        run: ./gradlew :app:createDistributable -PappVersion="${TAG_NAME#v}" --no-daemon

      - name: Package
        working-directory: ClaudeRelayLinux
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
        run: |
          IMAGE=app/build/compose/binaries/main/app/coderelay
          test -d "$IMAGE" || { echo "distributable image missing at $IMAGE"; exit 1; }

          # The native library is staged into the image's resources directory
          # (app/build.gradle.kts `stageNativeTerminal`), which the launcher puts
          # on java.library.path; assert it is there rather than discovering at
          # runtime that the terminal cannot start.
          if ! find "$IMAGE" -name 'libjni_cb_term.so' | grep -q .; then
            echo "libjni_cb_term.so is not packaged — the terminal would fail to load"
            exit 1
          fi
          # jpackage embeds packaging/coderelay.png as lib/coderelay.png; the
          # PKGBUILD installs it into hicolor, so its absence is a release bug.
          test -f "$IMAGE/lib/coderelay.png" || { echo "app icon missing from image"; exit 1; }

          # Ship the desktop entry and the scalable icon alongside the image so
          # the AUR package (and a manual installer) has one canonical copy.
          install -Dm644 packaging/coderelay.desktop "$IMAGE/../coderelay.desktop"
          install -Dm644 packaging/coderelay.svg "$IMAGE/../coderelay.svg"

          mkdir -p dist
          tar czf "dist/coderelay-${TAG_NAME}-linux-x86_64.tar.gz" \
            -C app/build/compose/binaries/main/app coderelay coderelay.desktop coderelay.svg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coderelay-linux-x86_64
          path: ClaudeRelayLinux/dist/*.tar.gz

  # ── Build the Linux server + CLI ─────────────────────────────────────────
  # The macOS server (ClaudeRelayServer/CLI) ported to Linux — see
  # docs/linux-server-spec.md. Statically linked against the Swift runtime, so
  # the tarball drops onto any glibc host and the coderelay-server-bin PKGBUILD
  # consumes exactly it. Gated on the full Swift test suite.

  build-linux-server:
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'

      # Gate the release on the tests, so a broken server cannot be published.
      - name: Test
        run: swift test

      - name: Build release binaries (static Swift runtime)
        run: |
          swift build -c release --static-swift-stdlib --product claude-relay-server
          swift build -c release --static-swift-stdlib --product claude-relay

      - name: Assemble the tarball
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
        run: |
          STAGE=dist/stage
          mkdir -p "$STAGE"
          install -m755 .build/release/claude-relay-server "$STAGE/"
          install -m755 .build/release/claude-relay "$STAGE/"

          # Agent-detection manifests, resolved by Bundle.module next to the
          # binary. Absent → the server fatal-errors on the first session create.
          BUNDLE=$(find .build/release -maxdepth 1 -name 'ClaudeRelay_ClaudeRelayServer.resources' -o -maxdepth 1 -name 'ClaudeRelay_ClaudeRelayServer.bundle' | head -1)
          test -n "$BUNDLE" || { echo "server resource bundle missing"; exit 1; }
          cp -a "$BUNDLE" "$STAGE/"

          install -m755 Scripts/hooks/claude-relay-state-hook.sh "$STAGE/"
          install -m644 packaging/claude-relay.service "$STAGE/"
          install -m644 LICENSE "$STAGE/"

          # Fail loudly if the server picked up a dynamic Swift/Foundation dep —
          # the whole point of the static build is that it has none.
          if ldd "$STAGE/claude-relay-server" | grep -iqE 'libswift|libFoundation'; then
            echo "server links the Swift runtime dynamically — static build regressed"
            ldd "$STAGE/claude-relay-server"; exit 1
          fi

          mkdir -p dist/out
          tar czf "dist/out/claude-relay-${TAG_NAME}-linux-x86_64.tar.gz" -C "$STAGE" .

      - name: Package.resolved is unchanged (macOS superset preserved)
        run: git checkout -- Package.resolved 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-relay-linux-x86_64
          path: dist/out/*.tar.gz

  # ── Build the Android client ─────────────────────────────────────────────
  # The APK is a first-class release asset next to the two Linux tarballs: the
  # user installs it by downloading it from the release page on the phone (no
  # adb), so it must be here, sectioned and checksummed like everything else.
  #
  # Signing: the release buildType reads `keystore.properties`. When the four
  # ANDROID_* secrets are set the job writes that file from them and the APK is
  # signed with the real key; otherwise Gradle's fallback debug-signs it with
  # the runner's throwaway key. Android refuses an update whose signer differs
  # from the installed app, so an unsigned CI build cannot be installed over a
  # phone that has a properly signed one — the release body says which it is.
  #   ANDROID_KEYSTORE_B64      base64 of the .jks/.keystore file
  #   ANDROID_KEYSTORE_PASSWORD store password
  #   ANDROID_KEY_ALIAS         key alias
  #   ANDROID_KEY_PASSWORD      key password
  # The Android versionName is its own milestone scheme (0.3-mNN, see
  # RELEASE.md), independent of the release tag; both appear in the body.

  build-android:
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      signing: ${{ steps.sign.outputs.signing }}
    defaults:
      run:
        working-directory: ClaudeRelayAndroid
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read versionName / versionCode
        id: version
        run: |
          VN=$(grep -E '^\s*versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VC=$(grep -E '^\s*versionCode = ' app/build.gradle.kts | sed -E 's/.*= *([0-9]+).*/\1/')
          test -n "$VN" && test -n "$VC" || { echo "could not read versionName/versionCode from app/build.gradle.kts"; exit 1; }
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "Android $VN (versionCode $VC)"

      - name: Configure release signing from secrets (if present)
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE_B64 is not set; the APK will be debug-signed with the runner's key."
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for v in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "ANDROID_KEYSTORE_B64 is set but ANDROID_$v is missing"; exit 1; }
          done
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          # keystore.properties is gitignored; build.gradle.kts reads exactly these keys.
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 keystore.properties
          echo "signing=release" >> "$GITHUB_OUTPUT"

      # Gate the release on the unit tests, as the Linux jobs do.
      - name: Test
        run: ./gradlew test testDebugUnitTest --no-daemon

      - name: Assemble the release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Package
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
          SIGNING: ${{ steps.sign.outputs.signing }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "release APK missing at $APK"; ls -R app/build/outputs/apk || true; exit 1; }

          # Prove the signer matches what the job believes it configured, and
          # print it so the run log shows which certificate a phone will see.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            # AGP normally pulls build-tools in during the build; make sure.
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "build-tools;34.0.0"
            APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          fi
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          if [ "$SIGNING" = "release" ] && grep -q 'CN=Android Debug' /tmp/certs.txt; then
            echo "expected the release key but the APK is debug-signed — keystore.properties was not picked up"
            exit 1
          fi

          mkdir -p dist
          cp "$APK" "dist/coderelay-${TAG_NAME}-android.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coderelay-android
          path: ClaudeRelayAndroid/dist/*.apk

  # ── Create GitHub Release + publish artifacts ───────────────────────────

  release:
    needs: [resolve-version, build, build-linux, build-linux-server, build-android]
    # The Linux client, Linux server and Android APK are the artifacts this
    # release exists to publish, so all three gate it; the macOS build above is
    # best-effort (see its comment) and only adds assets when it succeeds.
    if: ${{ !cancelled() && needs.resolve-version.result == 'success' && needs.build-linux.result == 'success' && needs.build-linux-server.result == 'success' && needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      source_sha256: ${{ steps.sha.outputs.source_sha256 }}
      linux_sha256: ${{ steps.sha.outputs.linux_sha256 }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute binary checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.apk | tee checksums.txt

      - name: Compute source tarball SHA256
        id: sha
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          SOURCE_SHA=$(curl -sL "https://github.com/${REPO}/archive/refs/tags/${TAG_NAME}.tar.gz" | sha256sum | awk '{print $1}')
          echo "Source tarball SHA256: $SOURCE_SHA"
          echo "source_sha256=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

          # The Linux tarball's checksum goes into the AUR PKGBUILD. Taken from
          # the artifact we just built rather than re-downloading the published
          # asset, so the value cannot drift from what is actually shipped.
          LINUX_TARBALL="artifacts/coderelay-${TAG_NAME}-linux-x86_64.tar.gz"
          if [ -f "$LINUX_TARBALL" ]; then
            LINUX_SHA=$(sha256sum "$LINUX_TARBALL" | awk '{print $1}')
            echo "Linux tarball SHA256: $LINUX_SHA"
            echo "linux_sha256=$LINUX_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "Linux tarball not found; the AUR job will skip."
          fi

      # The release body is one section per platform — what the asset is, how
      # to install it, and its checksum — so a visitor to the Releases page can
      # find their download without reading the changelog. The auto-generated
      # "What's Changed" list is appended below it by action-gh-release.
      - name: Write release notes
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
          REPO: ${{ github.repository }}
          ANDROID_VERSION_NAME: ${{ needs.build-android.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ needs.build-android.outputs.version_code }}
          ANDROID_SIGNING: ${{ needs.build-android.outputs.signing }}
        run: |
          DL="https://github.com/${REPO}/releases/download/${TAG_NAME}"
          CLIENT="coderelay-${TAG_NAME}-linux-x86_64.tar.gz"
          SERVER="claude-relay-${TAG_NAME}-linux-x86_64.tar.gz"
          APK="coderelay-${TAG_NAME}-android.apk"
          sha() { awk -v f="$1" '$2 == f { print $1 }' artifacts/checksums.txt; }

          {
            echo "## Downloads"
            echo
            echo "| Platform | Asset | Version |"
            echo "|---|---|---|"
            echo "| Linux client (x86_64) | [\`${CLIENT}\`](${DL}/${CLIENT}) | ${TAG_NAME} |"
            echo "| Linux server + CLI (x86_64) | [\`${SERVER}\`](${DL}/${SERVER}) | ${TAG_NAME} |"
            echo "| Android client | [\`${APK}\`](${DL}/${APK}) | ${ANDROID_VERSION_NAME} (versionCode ${ANDROID_VERSION_CODE}) |"
            for f in artifacts/claude-relay-${TAG_NAME}-macos-*.tar.gz; do
              [ -f "$f" ] || continue
              b=$(basename "$f"); arch=${b#claude-relay-${TAG_NAME}-macos-}; arch=${arch%.tar.gz}
              echo "| macOS server + CLI (${arch}) | [\`${b}\`](${DL}/${b}) | ${TAG_NAME} |"
            done
            echo "| macOS server + CLI | Homebrew: \`brew install miguelriotinto/clauderelay/clauderelay\` | ${TAG_NAME} |"
            echo "| iOS / macOS app | TestFlight | — |"
            echo
            echo "### Linux client"
            echo
            echo "Compose Desktop app for Arch / Omarchy and any x86_64 glibc host, with its own JRE and the libvterm terminal bundled. Runtime deps: \`libsecret\`, \`libnotify\`."
            echo
            echo '```bash'
            echo "yay -S coderelay-bin                       # AUR"
            echo "# or manually:"
            echo "curl -LO ${DL}/${CLIENT}"
            echo "tar xzf ${CLIENT} && ./coderelay/bin/coderelay"
            echo '```'
            echo
            echo "### Linux server + CLI"
            echo
            echo "\`claude-relay-server\` and the \`claude-relay\` CLI, statically linked against the Swift runtime, plus the systemd user unit and the agent state hook. Runs as \`claude-relay.service\` for your user."
            echo
            echo '```bash'
            echo "yay -S coderelay-server-bin                # AUR"
            echo "claude-relay setup                         # starts the service, prints a pairing QR"
            echo "# or manually:"
            echo "curl -LO ${DL}/${SERVER}"
            echo "mkdir -p claude-relay && tar xzf ${SERVER} -C claude-relay"
            echo '```'
            echo
            echo "### Android client"
            echo
            echo "Version ${ANDROID_VERSION_NAME} (versionCode ${ANDROID_VERSION_CODE}). Open this page on the phone, download the APK, and install it over the existing app; allow installs from your browser if Android asks."
            if [ "$ANDROID_SIGNING" != "release" ]; then
              echo
              echo "> **Signing:** this APK is debug-signed with a CI key. Android will not install it over a build signed with a different key — uninstall the old app first, or configure the \`ANDROID_KEYSTORE_*\` repository secrets so the release workflow signs with the project key."
            fi
            echo
            echo "### macOS"
            echo
            echo "The server ships through Homebrew (the tap is bumped by this release); the desktop and iOS apps go through TestFlight. The macOS tarballs above, when present, are the bare server + CLI binaries for a manual install."
            echo
            echo "### Checksums (SHA-256)"
            echo
            echo '```'
            cat artifacts/checksums.txt
            echo '```'
            echo
          } > release-notes.md

          echo "=== release-notes.md ==="
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.apk
            artifacts/checksums.txt

  # ── Push formula update to homebrew-clauderelay tap ─────────────────────
  # Needs the HOMEBREW_TAP_TOKEN repo secret: a PAT with `contents: write`
  # on miguelriotinto/homebrew-clauderelay. If the secret is missing or
  # empty, this job is skipped (useful for dry-run tag pushes).

  homebrew:
    needs: [resolve-version, release]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    steps:
      - name: Check tap token is configured
        id: check_token
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN secret is not set; skipping tap update."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tap
        if: steps.check_token.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          repository: miguelriotinto/homebrew-clauderelay
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula url + sha256
        if: steps.check_token.outputs.skip == 'false'
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
          SOURCE_SHA: ${{ needs.release.outputs.source_sha256 }}
          REPO: ${{ github.repository }}
        run: |
          cd tap
          FORMULA=Formula/clauderelay.rb

          # Replace url line (anchored to the archive path so we only touch
          # the release URL, not the head "…" URL).
          sed -i.bak -E \
            "s|^(  url \"https://github.com/${REPO//\//\\/}/archive/refs/tags/)v[0-9]+\.[0-9]+\.[0-9]+(\.tar\.gz\")$|\1${TAG_NAME}\2|" \
            "$FORMULA"

          # Replace sha256 line (the first one, which belongs to `url`; the
          # formula has no bottle block so there's only one).
          sed -i.bak -E \
            "s|^(  sha256 \")[a-f0-9]{64}(\")$|\1${SOURCE_SHA}\2|" \
            "$FORMULA"

          rm -f "$FORMULA.bak"

          echo "=== Diff ==="
          git --no-pager diff "$FORMULA"

          if git diff --quiet "$FORMULA"; then
            echo "Formula unchanged (already at ${TAG_NAME}?). Nothing to commit."
            exit 0
          fi

      - name: Commit + push
        if: steps.check_token.outputs.skip == 'false'
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
        run: |
          cd tap
          if git diff --quiet Formula/clauderelay.rb; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/clauderelay.rb
          git commit -m "clauderelay ${TAG_NAME}" -m "Automated bump from ClaudeRelay release workflow."
          git push

  # ── Push PKGBUILD update to the AUR ─────────────────────────────────────
  # Needs two secrets:
  #   AUR_SSH_KEY   — private key of an SSH keypair registered on the AUR
  #                   account that owns `coderelay-bin`
  #   AUR_USERNAME  — the AUR account name (for the commit author)
  # If either is missing the job skips, so a dry-run tag push is harmless.
  #
  # Mirrors the homebrew job above. The AUR is a plain git remote, so this is
  # a checkout, a sed of pkgver + sha256, and a push — .SRCINFO regenerated
  # from the PKGBUILD, which the AUR requires to match.

  aur:
    needs: [resolve-version, release]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.linux_sha256 != '' }}
    steps:
      - name: Check AUR credentials are configured
        id: check_key
        env:
          KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "AUR_SSH_KEY secret is not set; skipping AUR update."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check_key.outputs.skip == 'false'
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Configure SSH for aur.archlinux.org
        if: steps.check_key.outputs.skip == 'false'
        env:
          KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # Pin the host key rather than disabling verification: this pushes a
          # package thousands of people install, so an unverified host is not
          # an acceptable shortcut.
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF

      - name: Clone the AUR package
        if: steps.check_key.outputs.skip == 'false'
        run: git clone ssh://aur@aur.archlinux.org/coderelay-bin.git aur

      - name: Update pkgver + sha256
        if: steps.check_key.outputs.skip == 'false'
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
          LINUX_SHA: ${{ needs.release.outputs.linux_sha256 }}
        run: |
          # The AUR pkgver has no leading "v"; the release tag does.
          PKGVER="${TAG_NAME#v}"

          cp ClaudeRelayLinux/packaging/PKGBUILD aur/PKGBUILD
          cd aur

          sed -i -E "s|^pkgver=.*|pkgver=${PKGVER}|" PKGBUILD
          sed -i -E "s|^pkgrel=.*|pkgrel=1|" PKGBUILD
          sed -i -E "s|^sha256sums=\(.*\)$|sha256sums=('${LINUX_SHA}')|" PKGBUILD

          echo "=== PKGBUILD diff ==="
          git --no-pager diff PKGBUILD || true

          if git diff --quiet PKGBUILD; then
            echo "PKGBUILD unchanged (already at ${PKGVER}?). Nothing to push."
            exit 0
          fi

      # .SRCINFO is generated metadata the AUR validates against the PKGBUILD;
      # a mismatch is rejected on push. Generated in an Arch container because
      # makepkg is not available on the runner.
      - name: Regenerate .SRCINFO
        if: steps.check_key.outputs.skip == 'false'
        run: |
          docker run --rm -v "$PWD/aur:/pkg" -w /pkg archlinux:base-devel \
            bash -c 'useradd -m build && chown -R build /pkg && su build -c "makepkg --printsrcinfo" > .SRCINFO'
          head -20 aur/.SRCINFO

      - name: Commit + push
        if: steps.check_key.outputs.skip == 'false'
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
        run: |
          cd aur
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "${AUR_USERNAME:-github-actions}"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "coderelay-bin ${TAG_NAME#v}" -m "Automated bump from the CodeRelay release workflow."
          git push
