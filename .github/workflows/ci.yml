name: CI

on:
  pull_request:
    paths-ignore:
      - 'ClaudeRelayAndroid/**'
  push:
    branches: [main]
    paths-ignore:
      - 'ClaudeRelayAndroid/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: swift build + test + lint
    runs-on: macos-15
    # The full suite runs in ~20s; a healthy job finishes in a few minutes
    # (incl. the WhisperKit/swift-syntax compile). Cap the job so a hung test
    # fails fast (~15 min) instead of stalling toward GitHub's 6h default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode 16
        run: |
          # macos-15 ships multiple Xcode versions; pick the highest 16.x available.
          # swift-syntax 602.0.0 (pulled via WhisperKit → swift-transformers) needs
          # Swift 6.1+, which ships with Xcode 16.3.
          XCODE=$(ls -d /Applications/Xcode_16.*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Cache SPM artifacts
        uses: actions/cache@v5
        with:
          path: .build
          key: spm-${{ runner.os }}-xcode16-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode16-

      - name: Swift version
        run: swift --version

      - name: swift build
        run: swift build

      - name: swift test
        # Serial mode emits per-test XCTest counts that are visible in CI logs.
        # The full suite currently runs in ~5 s; parallel's speed win doesn't
        # justify losing the per-test output.
        #
        # Diagnostics (temporary, for the hang first seen 8 Jul): the runner is
        # macOS 15 / Swift 6.1 while dev machines are on 6.2, and the failure
        # does not reproduce locally, so evidence has to come from here.
        #   - SWIFT_BACKTRACE: print a symbolicated stack on crash, so a dead
        #     process is distinguishable from a stuck one.
        #   - `sample` after a stall: if the suite is still alive past the point
        #     it should have finished, dump every thread's stack. This is the
        #     only way to see WHICH await is parked.
        run: |
          set -o pipefail
          export SWIFT_BACKTRACE=enable=yes,sanitize=yes,threads=all
          swift test 2>&1 | tee /tmp/swift-test.log &
          test_pid=$!

          # Watchdog: the suite takes ~70 s healthy. If it is still running at
          # 5 min it is hung, not slow — sample it, then let it keep going so
          # the job's own timeout still applies.
          (
            sleep 300
            if kill -0 "$test_pid" 2>/dev/null; then
              echo "::group::Hang diagnostics (suite still running at 5 min)"
              echo "--- last output line seen ---"
              tail -3 /tmp/swift-test.log || true
              for p in $(pgrep -f 'ClaudeRelayPackageTests|xctest' || true); do
                echo "--- sample of pid $p ---"
                /usr/bin/sample "$p" 3 -mayDie 2>&1 | head -150 || true
                echo "--- spindump-style thread states for $p ---"
                /bin/ps -M -p "$p" 2>&1 | head -40 || true
              done
              echo "::endgroup::"
            fi
          ) &
          watchdog=$!

          wait "$test_pid"
          status=$?
          kill "$watchdog" 2>/dev/null || true
          echo "swift test exited with status $status"
          exit $status

      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --config .swiftlint.yml --reporter github-actions-logging
        continue-on-error: true

  ios-build:
    # Builds for the iOS *device* SDK (not simulator). The simulator build
    # plan mis-resolves LLM.swift's swift-syntax-based macros against the
    # iphonesimulator SDK, producing "no such module '_SwiftSyntaxCShims'".
    # The device build uses the same plan TestFlight archives go through,
    # so this is the signal we actually care about: "does what we ship
    # compile?"
    name: iOS app build (device SDK)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_16.*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build iOS app for device
        run: |
          xcodebuild \
            -project ClaudeRelay.xcodeproj \
            -scheme ClaudeRelayApp \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

  mac-build:
    name: macOS app build
    # macos-26: the macOS app's toolbar uses macOS 26 SDK APIs (ToolbarSpacer,
    # guarded at runtime by `if #available(macOS 26.0, *)`). `#available` gates
    # execution, but the symbol must still exist in the *compile-time SDK* —
    # Xcode 16.4 (the newest on macos-15) predates it and fails with "cannot
    # find 'ToolbarSpacer' in scope". Build against the macOS 26 SDK instead.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode 26
        run: |
          # macos-26 ships Xcode 26.x, whose SDK contains the macOS 26 toolbar
          # APIs the app uses. Pick the highest 26.x available.
          XCODE=$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build macOS app
        run: |
          xcodebuild \
            -project ClaudeRelay.xcodeproj \
            -scheme ClaudeRelayMac \
            -configuration Debug \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
