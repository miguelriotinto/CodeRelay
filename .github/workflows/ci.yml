name: CI

on:
  pull_request:
    paths-ignore:
      - 'CodeRelayAndroid/**'
  push:
    branches: [main]
    paths-ignore:
      - 'CodeRelayAndroid/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: swift build + test + lint
    runs-on: macos-26
    # A healthy job finishes in a few minutes. Cap it so a hung test fails fast
    # (~15 min) instead of stalling toward GitHub's 6h default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode 26
        run: |
          # Runs the newest Xcode 26.x present on the runner image. The float is
          # deliberate: image minors are retired without notice, so pinning one
          # would trade a toolchain surprise for a "no such Xcode" surprise.
          # Several pins declare swift-tools-version 6.2, so a 26.x toolchain is
          # the floor for loading their manifests at all.
          XCODE=$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Cache SPM artifacts
        uses: actions/cache@v5
        with:
          path: .build
          key: spm-${{ runner.os }}-xcode26-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode26-

      - name: Swift version
        run: swift --version

      - name: swift build
        run: swift build

      - name: Package.resolved is unchanged after the macOS resolve
        # No job may rewrite the committed Package.resolved. If a toolchain bump
        # changes SwiftPM's serialisation of the file (format version,
        # originHash) or the resolved versions, re-resolve locally with that
        # toolchain and commit the result in its own change — never let CI's
        # copy win.
        run: git diff --exit-code -- Package.resolved

      - name: swift test
        # Serial mode emits per-test XCTest counts that are visible in CI logs;
        # parallel's speed win doesn't justify losing the per-test output.
        run: swift test

      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --config .swiftlint.yml --reporter github-actions-logging
        continue-on-error: true

  linux-server:
    # The server, CLI and Kit build and test on Linux — the whole premise of
    # docs/linux-server-spec.md. The Apple client library (CodeRelayClient) is
    # not declared there (Package.swift, AD-1), so this job proves the ported
    # server against the SAME test suite the macOS job runs, plus the Linux
    # seam tests.
    name: linux server build + test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # Pinned (not floating like the macOS job, which takes whatever Xcode the
      # image ships) so the Linux resolve is reproducible; the pins declare
      # swift-tools-version up to 6.2, which this toolchain can load. The diff
      # step below enforces the actual invariant: no job may rewrite the
      # committed Package.resolved.
      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'

      # forkpty(3) lives in libutil; wl-clipboard/xclip are runtime optionals
      # the clipboard tests inject around, so they are not needed here.
      - name: Swift version
        run: swift --version

      - name: swift build
        run: swift build

      - name: Package.resolved is unchanged after the Linux resolve
        run: git diff --exit-code -- Package.resolved

      - name: swift test
        run: swift test

  ios-build:
    # Builds for the iOS *device* SDK (not simulator): the same build plan
    # TestFlight archives go through, so this is the signal we actually care
    # about — "does what we ship compile?"
    name: iOS app build (device SDK)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_16.*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build iOS app for device
        run: |
          xcodebuild \
            -project CodeRelay.xcodeproj \
            -scheme CodeRelayApp \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      # The workspace copy is what a TestFlight archive resolves against, and
      # xcodebuild is free to rewrite it. Same rule as the root file: CI never
      # gets to change the committed pins.
      - name: Workspace Package.resolved is unchanged after the build
        run: git diff --exit-code -- CodeRelay.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

  mac-build:
    name: macOS app build
    # macos-26: the macOS app's toolbar uses macOS 26 SDK APIs (ToolbarSpacer,
    # guarded at runtime by `if #available(macOS 26.0, *)`). `#available` gates
    # execution, but the symbol must still exist in the *compile-time SDK* —
    # Xcode 16.4 (the newest on macos-15) predates it and fails with "cannot
    # find 'ToolbarSpacer' in scope". Build against the macOS 26 SDK instead.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode 26
        run: |
          # macos-26 ships Xcode 26.x, whose SDK contains the macOS 26 toolbar
          # APIs the app uses. Pick the highest 26.x available.
          XCODE=$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build macOS app
        run: |
          xcodebuild \
            -project CodeRelay.xcodeproj \
            -scheme CodeRelayMac \
            -configuration Debug \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      # The workspace copy is what a TestFlight archive resolves against, and
      # xcodebuild is free to rewrite it. Same rule as the root file: CI never
      # gets to change the committed pins.
      - name: Workspace Package.resolved is unchanged after the build
        run: git diff --exit-code -- CodeRelay.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
