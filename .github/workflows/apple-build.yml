# One Apple app's archive → TestFlight upload, called by apple-release.yml
# once per platform. Spec: docs/superpowers/specs/2026-11-01-remote-release-pipeline-design.md
# (Part A). Never falls back to a local build or to an Xcode 26 runner.
name: Apple build (reusable)

on:
  workflow_call:
    inputs:
      platform:
        type: string   # ios | macos
        required: true
      dry_run:
        type: boolean
        required: true

jobs:
  build:
    name: Archive and upload (${{ inputs.platform }})
    runs-on: xcode-27
    outputs:
      build: ${{ steps.number.outputs.build }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags + history for the notes and the gate's ancestor

      - name: Platform settings
        run: |
          # altool finds the key as $API_PRIVATE_KEYS_DIR/AuthKey_<KEYID>.p8.
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          case "${{ inputs.platform }}" in
            ios)   echo "SCHEME=CodeRelayApp" ; echo "BUNDLE_ID=com.claude.relay" ;
                   echo "DESTINATION=generic/platform=iOS" ; echo "TAG_PREFIX=ios-build" ;;
            macos) echo "SCHEME=CodeRelayMac" ; echo "BUNDLE_ID=com.claude.relay.mac" ;
                   echo "DESTINATION=generic/platform=macOS" ; echo "TAG_PREFIX=mac-build" ;;
            *) echo "unknown platform ${{ inputs.platform }}"; exit 1 ;;
          esac >> "$GITHUB_ENV"

      - name: Select newest release Xcode 27
        run: |
          # Release builds only; symlinks are resolved because the image links
          # Xcode_27.2.app to Xcode_27.2_Release_Candidate.
          XCODE=$(for app in /Applications/Xcode_27.*.app; do
                    real=$(basename "$(realpath "$app")")
                    case "$real" in (*Release_Candidate*|*[Bb]eta*) continue ;; esac
                    echo "/Applications/$real"
                  done | sort -uV | tail -1)
          if [ -z "$XCODE" ]; then echo "No release Xcode 27 on this runner:"; ls -d /Applications/Xcode*.app; exit 1; fi
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          # iPhone Duo's layout is gated on linking the iOS 27.1 SDK (CLAUDE.md).
          xcodebuild -version | awk '/^Xcode /{split($2,v,"."); ok=(v[1]>27||(v[1]==27&&v[2]>=1))} END{exit !ok}' \
            || { echo "Xcode 27.1 or later required; $XCODE is too old"; exit 1; }

      - name: Download the Metal toolchain
        # Xcode 27 no longer bundles it; SwiftTerm's shader needs it.
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen

      - name: Write the App Store Connect key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -z "$ASC_API_KEY_P8" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "ASC_API_KEY_P8 / ASC_API_KEY_ID / ASC_API_ISSUER_ID secrets are not set"; exit 1
          fi
          umask 077
          printf '%s\n' "$ASC_API_KEY_P8" > "$ASC_KEY_PATH"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'pyjwt[crypto]'

      - name: Import the development signing certificate
        # Without an Apple Development identity in the keychain, automatic
        # signing mints a NEW development certificate on every fresh runner.
        # They piled up until the account's cap failed the macOS archive
        # ("reached the maximum number of certificates", run 41452870613).
        # One stored certificate is imported and reused instead.
        env:
          CERT_P12_B64: ${{ secrets.APPLE_DEV_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEV_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12_B64" ]; then
            echo "::warning::APPLE_DEV_CERT_P12_B64 is not set: this archive mints a new development certificate (docs/RELEASING.md, Secrets)."
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          umask 077
          printf '%s' "$CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/dev.p12"
          security import "$RUNNER_TEMP/dev.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dev.p12"
          # Lets codesign use the key without a UI prompt on a headless runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          # Prepend ours, keeping the existing search list.
          read -r -a EXISTING <<< "$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$KC" "${EXISTING[@]}"
          security find-identity -v -p codesigning "$KC" | grep -q '"Apple Development' \
            || { echo "APPLE_DEV_CERT_P12_B64 holds no Apple Development identity"; exit 1; }

      - name: Next build number
        id: number
        run: |
          # project.yml's value is only a floor (spec Part A §3).
          FLOOR=$(awk -v t="  $SCHEME:" '$0==t{f=1} f&&/CURRENT_PROJECT_VERSION:/{gsub(/[^0-9]/,"");print;exit}' project.yml)
          [ -n "$FLOOR" ] || { echo "no CURRENT_PROJECT_VERSION for $SCHEME in project.yml"; exit 1; }
          N=$("$RUNNER_TEMP/venv/bin/python" Scripts/ci/asc.py next-build --bundle-id "$BUNDLE_ID" --floor "$FLOOR")
          echo "floor $FLOOR → build $N"
          echo "build=$N" >> "$GITHUB_OUTPUT"
          echo "BUILD=$N" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          xcodebuild archive \
            -project CodeRelay.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "$DESTINATION" \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -skipMacroValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD"
          GOT=$(/usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleVersion" "$RUNNER_TEMP/app.xcarchive/Info.plist")
          [ "$GOT" = "$BUILD" ] || { echo "archive CFBundleVersion $GOT != $BUILD"; exit 1; }
          echo "archive CFBundleVersion $GOT"

      - name: Export and upload to App Store Connect
        if: ${{ !inputs.dry_run }}
        # Export locally, then upload with altool. xcodebuild's destination=upload
        # needs an Xcode account for its store-configuration request and fails
        # "Cannot verify client's JWT headers" with only an API key; altool
        # authenticates with the key alone.
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>T9WF95GC9T</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          case "${{ inputs.platform }}" in ios) EXT=ipa ;; macos) EXT=pkg ;; esac
          PKG=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name "*.$EXT" | head -1)
          [ -n "$PKG" ] || { echo "no .$EXT in $RUNNER_TEMP/export"; ls "$RUNNER_TEMP/export"; exit 1; }
          API_PRIVATE_KEYS_DIR=$(dirname "$ASC_KEY_PATH") xcrun altool --upload-app \
            -f "$PKG" -t "${{ inputs.platform }}" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool.log"
          grep -q "UPLOAD SUCCEEDED" "$RUNNER_TEMP/altool.log" || { echo "UPLOAD SUCCEEDED not in the altool output"; exit 1; }
          echo "UPLOAD SUCCEEDED (build $BUILD)"

      - name: Notes since the previous build
        run: |
          # Before tagging, so a rebuild of an already-tagged commit reads "no changes".
          PREV=$(git describe --tags --abbrev=0 --match "$TAG_PREFIX-*" HEAD 2>/dev/null || true)
          if [ -n "$PREV" ]; then git log --format=%s "$PREV..HEAD" > notes.txt; else git log --format=%s HEAD > notes.txt; fi
          VERSION=$(awk -v t="  $SCHEME:" '$0==t{f=1} f&&/MARKETING_VERSION:/{gsub(/[^0-9.]/,"");print;exit}' project.yml)
          {
            echo "### ${{ inputs.platform }} $VERSION ($BUILD)${{ inputs.dry_run && ' — dry run, not uploaded' || '' }}"
            echo
            echo "Commit \`$GITHUB_SHA\`, changes since ${PREV:-the first commit} ($(wc -l < notes.txt | tr -d ' ') commits):"
            echo
            head -100 notes.txt | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.platform }}-notes
          path: notes.txt

      - name: Tag the build
        if: ${{ !inputs.dry_run }}
        run: |
          git tag "$TAG_PREFIX-$BUILD" "$GITHUB_SHA"
          git push origin "$TAG_PREFIX-$BUILD"

      - name: Collect the distribution logs
        # `xcodebuild -exportArchive` reports only a one-line summary ("The data
        # couldn't be read because it isn't in the correct format"); the cause
        # is in the .xcdistributionlogs bundle it writes under $TMPDIR.
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/distlogs"
          find "${TMPDIR:-/tmp}" -maxdepth 2 -name '*.xcdistributionlogs' -exec cp -R {} "$RUNNER_TEMP/distlogs/" \; 2>/dev/null || true
          ls "$RUNNER_TEMP/distlogs"

      - name: Upload the distribution logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.platform }}-distribution-logs
          path: ${{ runner.temp }}/distlogs
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove the App Store Connect key
        if: always()
        run: rm -f "$ASC_KEY_PATH"

  what-to-test:
    # Apple-side processing takes up to ~1 h; this job failing never retracts
    # or fails the upload (spec Part A §9).
    name: What to Test (${{ inputs.platform }})
    needs: build
    if: ${{ !inputs.dry_run && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    env:
      ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.platform }}-notes
      - name: Set What to Test
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          export ASC_KEY_PATH
          umask 077
          printf '%s\n' "$ASC_API_KEY_P8" > "$ASC_KEY_PATH"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'pyjwt[crypto]'
          case "${{ inputs.platform }}" in ios) BUNDLE_ID=com.claude.relay ;; macos) BUNDLE_ID=com.claude.relay.mac ;; esac
          "$RUNNER_TEMP/venv/bin/python" Scripts/ci/asc.py what-to-test \
            --bundle-id "$BUNDLE_ID" --build "${{ needs.build.outputs.build }}" --notes-file notes.txt
      - name: Report failure
        if: failure()
        run: echo "⚠️ What to Test was not set on ${{ inputs.platform }} build ${{ needs.build.outputs.build }}; the upload itself succeeded." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
