name: Android CI

on:
  pull_request:
    paths:
      - 'ClaudeRelayAndroid/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'ClaudeRelayAndroid/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-protocol:
    name: core-protocol test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ClaudeRelayAndroid
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run :core-protocol tests
        run: ./gradlew :core-protocol:test --no-daemon
