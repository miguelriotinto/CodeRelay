name: Android CI

on:
  pull_request:
    paths:
      - 'ClaudeRelayAndroid/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'ClaudeRelayAndroid/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ClaudeRelayAndroid
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests (all modules — pure-JVM `test` + Android-lib `testDebugUnitTest`)
        # Aggregate tasks run unit tests across EVERY module that defines them, so
        # modules added in future milestones are covered without editing this list.
        # (`test` covers kotlin.jvm modules; `testDebugUnitTest` covers android.library/app.)
        run: ./gradlew test testDebugUnitTest --no-daemon

      - name: Compile deferred instrumented test sources (storage needs a device to run)
        run: ./gradlew :core-storage:compileDebugAndroidTestKotlin --no-daemon

      - name: Assemble the whole project (verifies the full module graph links)
        run: ./gradlew assembleDebug --no-daemon

      # The release workflow ships :app:assembleRelease (R8 full-mode, resource
      # shrinking). Build it here too so a keep-rule regression fails the PR
      # instead of the tag. Debug-signed — keystore.properties is absent on CI.
      - name: Assemble the release APK (what the Release workflow publishes)
        run: ./gradlew :app:assembleRelease --no-daemon
