# TEMPORARY: exercises release.yml's arch-packages build against v0.3.41. Delete before merge.
name: temp arch-packages test
on:
  push:
    branches: [ci/arch-packages-on-releases]
permissions:
  contents: read
jobs:
  arch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read v0.3.41 tarball checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.3.41 -p checksums.txt -D "$RUNNER_TEMP"
          echo "T_CLIENT_SHA=$(awk '$2=="coderelay-v0.3.41-linux-x86_64.tar.gz"{print $1}' "$RUNNER_TEMP/checksums.txt")" >> "$GITHUB_ENV"
          echo "T_SERVER_SHA=$(awk '$2=="claude-relay-v0.3.41-linux-x86_64.tar.gz"{print $1}' "$RUNNER_TEMP/checksums.txt")" >> "$GITHUB_ENV"

      - name: Stamp pkgver + sha256 into the PKGBUILDs
        env:
          TAG_NAME: v0.3.41
          CLIENT_SHA: ${{ env.T_CLIENT_SHA }}
          SERVER_SHA: ${{ env.T_SERVER_SHA }}
        run: |
          # pkgver has no leading "v"; the release tag does.
          PKGVER="${TAG_NAME#v}"
          mkdir -p pkg/coderelay-bin pkg/coderelay-server-bin
          cp CodeRelayLinux/packaging/PKGBUILD pkg/coderelay-bin/
          cp packaging/PKGBUILD packaging/coderelay-server.install pkg/coderelay-server-bin/
          stamp() {
            [ -n "$2" ] || { echo "No tarball checksum from the release job for $1"; exit 1; }
            sed -i -E "s|^pkgver=.*|pkgver=${PKGVER}|; s|^pkgrel=.*|pkgrel=1|; s|^sha256sums=\(.*\)$|sha256sums=('$2')|" "$1/PKGBUILD"
            grep -q "^sha256sums=('$2')$" "$1/PKGBUILD" || { echo "sha256sums was not rewritten in $1"; exit 1; }
            grep -E '^(pkgname|pkgver|pkgrel|sha256sums)=' "$1/PKGBUILD"
          }
          stamp pkg/coderelay-bin "$CLIENT_SHA"
          stamp pkg/coderelay-server-bin "$SERVER_SHA"

      # makepkg refuses to run as root, hence the build user. --nodeps because
      # these are prebuilt packages: the runtime deps only matter at install,
      # where pacman -U resolves them exactly as it will on a user's machine.
      - name: Build and install-test in Arch
        run: |
          docker run --rm -v "$PWD/pkg:/pkg" archlinux:base-devel bash -euo pipefail -c '
            pacman -Syu --noconfirm >/dev/null
            useradd -m build && chown -R build /pkg
            for p in coderelay-bin coderelay-server-bin; do
              su build -c "cd /pkg/$p && makepkg --nodeps --noconfirm"
            done
            pacman -U --noconfirm /pkg/*/*.pkg.tar.zst
            pacman -Q coderelay-bin coderelay-server-bin
            claude-relay --help >/dev/null
            test -x /usr/bin/claude-relay-server
            ls -d /usr/bin/CodeRelay_CodeRelayServer.resources /usr/bin/CodeRelay_CodeRelayServer.bundle 2>/dev/null | grep -q .
            test -f /usr/lib/systemd/user/claude-relay.service
            test -x /usr/bin/coderelay
            test -f /usr/share/applications/coderelay.desktop
          '
          ls -l pkg/*/*.pkg.tar.zst

