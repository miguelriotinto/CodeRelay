name: ClaudeRelay
options:
  bundleIdPrefix: com.claude
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

packages:
  ClaudeRelayClient:
    path: .
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    majorVersion: 1.2.0

targets:
  ClaudeRelayApp:
    type: application
    platform: iOS
    sources:
      - path: ClaudeRelayApp
        excludes:
          - README.md
    dependencies:
      - package: ClaudeRelayClient
        product: ClaudeRelayClient
      - package: ClaudeRelayClient
        product: ClaudeRelaySpeech
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.claude.relay
        INFOPLIST_FILE: ClaudeRelayApp/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Code[Relay]"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Code[Relay] needs microphone access for voice-to-text input."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Code[Relay] uses speech recognition to convert voice input to terminal commands."
        INFOPLIST_KEY_NSCameraUsageDescription: "Code[Relay] uses the camera to scan QR codes for session sharing."
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: T9WF95GC9T
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "1.4.1"
        CURRENT_PROJECT_VERSION: "149"
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: ClaudeRelayApp/Info.plist
      properties:
        # App uses only Apple-provided cryptography (CryptoKit + system TLS),
        # which is exempt under U.S. export rules. Declaring this lets every
        # TestFlight upload skip the manual encryption-compliance gate that
        # otherwise blocks external distribution.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Scoped ATS: plaintext WebSocket is allowed only to RFC1918 /
          # link-local addresses (typical LAN server use). Plaintext to a
          # public hostname is refused — users who need it should configure
          # TLS on the server (see `bindAll` + `tlsCert`/`tlsKey`).
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: "com.claude.relay"
            CFBundleURLSchemes:
              - clauderelay
  ClaudeRelayAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ClaudeRelayAppTests
    dependencies:
      - target: ClaudeRelayApp
      - package: ClaudeRelayClient
        product: ClaudeRelaySpeech
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ClaudeRelayApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ClaudeRelayApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.claude.relay.tests
  ClaudeRelayMac:
    type: application
    platform: macOS
    sources:
      - path: ClaudeRelayMac
        excludes:
          - "**/.gitkeep"
          - "Info.plist"
          - "README.md"
    dependencies:
      - package: ClaudeRelayClient
        product: ClaudeRelayClient
      - package: ClaudeRelayClient
        product: ClaudeRelaySpeech
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.claude.relay.mac
        PRODUCT_NAME: "Code[Relay]"
        # Do NOT let actool own the app icon. Its generated AppIcon.icns is
        # truncated at 256px and it force-sets CFBundleIconFile=AppIcon, which
        # makes Finder composite onto its default rounded platter (light frame).
        # Instead we ship a complete prebuilt CodeRelayIcon.icns (16–1024) and
        # point CFBundleIconFile at it (see info.properties), matching how
        # Cursor.app does it.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_FILE: ClaudeRelayMac/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Code[Relay]"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Code[Relay] needs microphone access for voice-to-text input."
        INFOPLIST_KEY_NSCameraUsageDescription: "Code[Relay] uses the camera to scan QR codes for session sharing."
        INFOPLIST_KEY_LSUIElement: NO
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: T9WF95GC9T
        SUPPORTED_PLATFORMS: "macosx"
        MARKETING_VERSION: "1.1.1"
        CURRENT_PROJECT_VERSION: "75"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ENTITLEMENTS: ClaudeRelayMac/ClaudeRelayMac.entitlements
    info:
      path: ClaudeRelayMac/Info.plist
      properties:
        # Read versions from build settings (MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION above) so a single source of truth in
        # project.yml drives both iOS and Mac.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # User-facing app name (Dock, menu bar, Finder). The build-setting
        # form is ignored because this target ships a real Info.plist.
        CFBundleDisplayName: "Code[Relay]"
        # Ship a complete prebuilt .icns (all sizes 16–1024). actool's
        # generated AppIcon.icns is truncated at 256px, which makes Finder
        # composite the icon onto its default rounded-app platter (a light
        # frame). Pointing CFBundleIconFile at a full-size .icns avoids that.
        CFBundleIconFile: "CodeRelayIcon"
        # See iOS note — exempt because the app only uses Apple-provided crypto.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: "public.app-category.developer-tools"
        NSMicrophoneUsageDescription: "Code[Relay] needs microphone access for voice-to-text input."
        NSCameraUsageDescription: "Code[Relay] uses the camera to scan QR codes for session sharing."
        NSAppTransportSecurity:
          # See iOS app note — same scoping applies to the Mac app.
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: "com.claude.relay.mac"
            CFBundleURLSchemes:
              - clauderelay
  ClaudeRelayMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClaudeRelayMacTests
    dependencies:
      - target: ClaudeRelayMac
      - package: ClaudeRelayClient
        product: ClaudeRelayClient
      - package: ClaudeRelayClient
        product: ClaudeRelaySpeech
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Code[Relay].app/Contents/MacOS/Code[Relay]"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.claude.relay.mac.tests
