name: CodeRelay
options:
  bundleIdPrefix: com.singular
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

packages:
  CodeRelayClient:
    path: .
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    majorVersion: 1.2.0

targets:
  CodeRelayApp:
    type: application
    platform: iOS
    sources:
      - path: CodeRelayApp
        excludes:
          - README.md
    dependencies:
      - package: CodeRelayClient
        product: CodeRelayClient
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.singular.coderelay
        INFOPLIST_FILE: CodeRelayApp/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Code[Relay]"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Code[Relay] uses the camera to scan QR codes for session sharing."
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: T9WF95GC9T
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "1.6.0"
        CURRENT_PROJECT_VERSION: "208"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: CodeRelayApp/CodeRelayApp.entitlements
    info:
      path: CodeRelayApp/Info.plist
      properties:
        # App uses only Apple-provided cryptography (CryptoKit + system TLS),
        # which is exempt under U.S. export rules. Declaring this lets every
        # TestFlight upload skip the manual encryption-compliance gate that
        # otherwise blocks external distribution.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Scoped ATS: plaintext WebSocket is allowed only to RFC1918 /
          # link-local addresses (typical LAN server use). Plaintext to a
          # public hostname is refused — users who need it should configure
          # TLS on the server (see `bindAll` + `tlsCert`/`tlsKey`).
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: "com.singular.coderelay"
            CFBundleURLSchemes:
              - coderelay
  CodeRelayAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CodeRelayAppTests
    dependencies:
      - target: CodeRelayApp
      # The terminal scroll tests drive SwiftTerm's own scrolling API against a
      # real RelayTerminalView, so the test bundle needs the module too.
      - package: SwiftTerm
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CodeRelayApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CodeRelayApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.singular.coderelay.tests
  CodeRelayMac:
    type: application
    platform: macOS
    sources:
      - path: CodeRelayMac
        excludes:
          - "**/.gitkeep"
          - "Info.plist"
          - "README.md"
    dependencies:
      - package: CodeRelayClient
        product: CodeRelayClient
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.singular.coderelay.mac
        PRODUCT_NAME: "Code[Relay]"
        # The icon is CodeRelayMac/AppIcon.icon (Icon Composer), compiled into
        # Assets.car as CFBundleIconName = AppIcon. macOS 26 draws an app whose
        # icon comes only from an .icns small inside a light frame; this gives
        # it the full Liquid Glass tile, like Code[Whisper]. macOS 14-15 keep
        # reading CFBundleIconFile (the prebuilt CodeRelayIcon.icns, 16-1024).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: CodeRelayMac/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Code[Relay]"
        INFOPLIST_KEY_NSCameraUsageDescription: "Code[Relay] uses the camera to scan QR codes for session sharing."
        INFOPLIST_KEY_LSUIElement: NO
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: T9WF95GC9T
        SUPPORTED_PLATFORMS: "macosx"
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "121"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ENTITLEMENTS: CodeRelayMac/CodeRelayMac.entitlements
    info:
      path: CodeRelayMac/Info.plist
      properties:
        # Read versions from build settings (MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION above) so a single source of truth in
        # project.yml drives both iOS and Mac.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # User-facing app name (Dock, menu bar, Finder). The build-setting
        # form is ignored because this target ships a real Info.plist.
        CFBundleDisplayName: "Code[Relay]"
        # macOS 14-15: a complete prebuilt .icns (16-1024). macOS 26 uses
        # CFBundleIconName = AppIcon from Assets.car instead (see above).
        CFBundleIconFile: "CodeRelayIcon"
        CFBundleIconName: "AppIcon"
        # See iOS note — exempt because the app only uses Apple-provided crypto.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: "public.app-category.developer-tools"
        NSCameraUsageDescription: "Code[Relay] uses the camera to scan QR codes for session sharing."
        NSAppTransportSecurity:
          # See iOS app note — same scoping applies to the Mac app.
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: "com.singular.coderelay.mac"
            CFBundleURLSchemes:
              - coderelay
    postBuildScripts:
      # actool writes CFBundleIconFile = AppIcon and an AppIcon.icns that stops
      # at 256 px. macOS 26 ignores both (it reads CFBundleIconName from
      # Assets.car); macOS 14-15 would show that 256 px icon. Point them at the
      # complete prebuilt .icns instead. Runs before code signing, so the
      # signature covers the edit.
      - name: Use the full .icns on macOS 14-15
        # Declared inputs order this after Info.plist processing and actool;
        # without them the build system ran it before the plist existed.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Assets.car
        outputFiles:
          - $(DERIVED_FILE_DIR)/full-icns.stamp
        script: |
          set -e
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile CodeRelayIcon" "$PLIST"
          rm -f "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/AppIcon.icns"
          touch "${DERIVED_FILE_DIR}/full-icns.stamp"
  CodeRelayMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CodeRelayMacTests
    dependencies:
      - target: CodeRelayMac
      - package: CodeRelayClient
        product: CodeRelayClient
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Code[Relay].app/Contents/MacOS/Code[Relay]"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.singular.coderelay.mac.tests
